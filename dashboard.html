<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>GYAN SEVA — Check Result</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background:linear-gradient(to bottom, #f5f5f5, #e0e7ff); min-height:100vh; padding:20px; }
    .container { max-width:800px; margin:0 auto; background:white; border-radius:24px; box-shadow:0 10px 30px rgba(0,0,0,0.1); overflow:hidden; }
    
    .header { background:linear-gradient(to right,#1a237e,#283593,#303f9f); color:white; padding:30px 25px; text-align:center; }
    .coaching-logo { width:100px; height:100px; border-radius:50%; border:3px solid #ffc107; object-fit:cover; background:#fff; margin:0 auto 15px; display:block; }
    .school-name { font-size:1.8rem; font-weight:700; margin-bottom:6px; }
    .location { font-size:0.9rem; opacity:0.85; margin-bottom:12px; }
    .director-info { display:flex; align-items:center; justify-content:center; gap:20px; flex-wrap:wrap; margin-top:5px; }
    .director-detail { display:inline-flex; align-items:center; gap:8px; font-size:0.85rem; background:rgba(255,255,255,0.12); padding:5px 15px; border-radius:40px; }
    
    .roll-section { padding:40px 30px; text-align:center; }
    .exam-name { font-size:1.3rem; color:#1a237e; margin-bottom:10px; }
    .exam-date { color:#666; margin-bottom:25px; }
    .input-group { display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin:20px 0; }
    .roll-input { padding:14px 20px; font-size:1rem; border:2px solid #e0e0e0; border-radius:50px; width:250px; text-align:center; }
    .roll-input:focus { outline:none; border-color:#1a237e; }
    .get-result-btn { background:#1a237e; color:white; padding:14px 30px; border:none; border-radius:50px; font-size:1rem; font-weight:600; cursor:pointer; transition:0.3s; }
    .get-result-btn:hover { background:#283593; transform:scale(1.02); }
    .back-btn { background:#6c757d; color:white; padding:14px 30px; border:none; border-radius:50px; font-size:1rem; font-weight:600; cursor:pointer; }
    .hint { font-size:0.8rem; color:#888; margin-top:20px; background:#f5f5f5; padding:10px; border-radius:30px; display:inline-block; }
    footer { text-align:center; padding:20px; color:#666; font-size:0.75rem; background:#f5f5f5; }
    @media (max-width:600px){ .school-name { font-size:1.3rem; } .coaching-logo { width:70px; height:70px; } .roll-input { width:200px; } }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <img id="coachingLogo" class="coaching-logo" src="https://via.placeholder.com/100?text=GYAN" onerror="this.src='https://via.placeholder.com/100?text=GYAN'">
    <h1 class="school-name" id="coachingName">GYAN SEVA</h1>
    <p class="location" id="coachingLocation">Loading...</p>
    <div class="director-info">
      <span class="director-detail"><i class="fas fa-user-tie"></i> <span id="directorName">Director</span></span>
      <span class="director-detail"><i class="fas fa-phone"></i> <span id="directorPhone">---</span></span>
    </div>
  </div>
  
  <div class="roll-section">
    <div class="exam-name" id="examName">Loading exam...</div>
    <div class="exam-date" id="examDate"></div>
    
    <div class="input-group">
      <input type="text" id="rollNumber" class="roll-input" placeholder="Enter Roll Number">
      <button class="get-result-btn" onclick="fetchResult()"><i class="fas fa-search"></i> Get Result</button>
    </div>
    
    <div id="hint" class="hint"></div>
    <div style="margin-top:20px;">
      <button class="back-btn" onclick="window.history.back()"><i class="fas fa-arrow-left"></i> Back</button>
    </div>
  </div>
  
  <footer>Powered by GYAN SEVA</footer>
</div>

<script type="module">
  import { db } from './firebase-config.js';
  import { doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  
  const urlParams = new URLSearchParams(window.location.search);
  const coachingId = urlParams.get('coaching');
  const resultId = urlParams.get('result');
  
  if(!coachingId || !resultId) {
    document.body.innerHTML = '<div style="text-align:center; padding:50px;"><h2>Invalid Link</h2><p>Please contact your institute.</p></div>';
  }
  
  async function loadData() {
    // Load coaching info
    const coachingDoc = await getDoc(doc(db, "coachings", coachingId));
    if(coachingDoc.exists()) {
      const c = coachingDoc.data();
      document.getElementById('coachingName').innerText = c.name || "GYAN SEVA";
      document.getElementById('coachingLocation').innerText = c.location || "Bihar, India";
      document.getElementById('directorName').innerText = c.director || 'Director';
      document.getElementById('directorPhone').innerText = c.phone || 'Not provided';
      if(c.logo) document.getElementById('coachingLogo').src = c.logo;
    }
    
    // Load result info
    const resultDoc = await getDoc(doc(db, "coachings", coachingId, "results", resultId));
    if(resultDoc.exists()) {
      const r = resultDoc.data();
      document.getElementById('examName').innerText = r.examName || "Examination Result";
      document.getElementById('examDate').innerHTML = r.examDate ? `📅 ${r.examDate}` : '';
      
      // Set hint if demo
      if(r.isDemo) {
        if(r.examName.includes('Exam 1')) document.getElementById('hint').innerHTML = '💡 Demo Roll Number: 101';
        else if(r.examName.includes('Exam 2')) document.getElementById('hint').innerHTML = '💡 Demo Roll Number: 202';
        else if(r.examName.includes('Exam 3')) document.getElementById('hint').innerHTML = '💡 Demo Roll Number: 303';
      }
    }
  }
  
  window.fetchResult = async () => {
    const roll = document.getElementById('rollNumber').value.trim();
    if(!roll) { alert("Please enter roll number"); return; }
    
    // Get student marks
    const studentDoc = await getDoc(doc(db, "coachings", coachingId, "results", resultId, "marks", roll));
    if(!studentDoc.exists()) { alert("Roll number not found. Please check and try again."); return; }
    
    const student = studentDoc.data();
    const resultDoc = await getDoc(doc(db, "coachings", coachingId, "results", resultId));
    const resultData = resultDoc.data();
    const subjects = resultData.subjects || [];
    
    // Calculate total and percentage
    let totalObtained = 0;
    for(let sub of subjects) {
      totalObtained += student.marks[sub] || 0;
    }
    const totalPercent = (totalObtained / (subjects.length * 100)) * 100;
    
    // Calculate division
    let division = '';
    if(totalPercent >= 60) division = 'FIRST DIVISION';
    else if(totalPercent >= 45) division = 'SECOND DIVISION';
    else if(totalPercent >= 30) division = 'THIRD DIVISION';
    else division = 'FAIL';
    
    // Build result viewer URL
    const resultUrl = `result-viewer.html?name=${encodeURIComponent(student.name)}&roll=${roll}&father=${encodeURIComponent(student.fatherName || '-')}&exam=${encodeURIComponent(resultData.examName)}&date=${resultData.examDate || ''}&subjects=${encodeURIComponent(JSON.stringify(subjects))}&marks=${encodeURIComponent(JSON.stringify(student.marks))}&percent=${totalPercent.toFixed(2)}&division=${encodeURIComponent(division)}`;
    
    window.open(resultUrl, '_blank');
  };
  
  loadData();
</script>
</body>
</html>
