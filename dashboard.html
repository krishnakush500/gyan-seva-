<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GYAN SEVA — Result Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
    body { background:linear-gradient(to bottom, #f5f5f5, #e0e7ff); min-height:100vh; padding:20px; }
    .container { max-width:1000px; margin:0 auto; background:white; border-radius:24px; box-shadow:0 5px 20px rgba(0,0,0,0.1); overflow:hidden; }
    .header { background:linear-gradient(135deg, #1e3a8a, #2563eb); color:white; padding:30px; text-align:center; }
    .school-name { font-size:2rem; font-weight:700; }
    .location { font-size:0.9rem; margin-top:5px; opacity:0.9; }
    .director-info { display:flex; align-items:center; justify-content:center; margin-top:15px; gap:15px; flex-wrap:wrap; }
    .director-photo { width:70px; height:70px; border-radius:50%; border:3px solid #ffc107; overflow:hidden; background:#fff; }
    .director-photo img { width:100%; height:100%; object-fit:cover; }
    .director-details { text-align:left; }
    .director-details h3 { font-size:1.1rem; color:#ffc107; }
    .director-details p { font-size:0.85rem; opacity:0.9; }
    .main-tabs { display:flex; background:white; border-bottom:2px solid #1e3a8a; }
    .tab-btn { flex:1; padding:15px; font-weight:600; border:none; background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
    .tab-btn.active { color:#1e3a8a; border-bottom:3px solid #1e3a8a; background:#f0f7ff; }
    .tab-content { display:none; padding:25px; background:#f9f9f9; min-height:450px; }
    .tab-content.active { display:block; }
    .result-item { background:white; padding:15px; border-radius:12px; margin-bottom:10px; cursor:pointer; border-left:4px solid #1e3a8a; display:flex; justify-content:space-between; align-items:center; }
    .roll-input-section { background:white; padding:20px; border-radius:12px; margin-top:15px; text-align:center; }
    .input-group { display:flex; justify-content:center; gap:10px; margin-top:10px; flex-wrap:wrap; }
    input { padding:12px; border-radius:10px; border:1px solid #ddd; width:200px; }
    button { padding:12px 24px; background:#1e3a8a; color:white; border:none; border-radius:10px; cursor:pointer; }
    .result-card { background:white; border-radius:16px; padding:20px; margin-top:20px; }
    .marks-table { width:100%; border-collapse:collapse; }
    .marks-table th { background:#1e3a8a; color:white; padding:10px; text-align:left; }
    .marks-table td { padding:10px; border-bottom:1px solid #eee; }
    .download-btn { background:#10b981; }
    footer { text-align:center; padding:15px; color:#666; font-size:0.75rem; background:#f5f5f5; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1 class="school-name" id="coachingName">GYAN SEVA</h1>
    <p class="location" id="coachingLocation">Loading...</p>
    <div class="director-info">
      <div class="director-photo"><img id="coachingLogo" src="https://via.placeholder.com/70?text=GYAN" alt="Logo"></div>
      <div class="director-details">
        <h3 id="directorName"><i class="fas fa-user-tie"></i> Director</h3>
        <p id="directorPhone"><i class="fas fa-phone"></i> Contact: --</p>
      </div>
    </div>
  </div>
  <div class="main-tabs">
    <button class="tab-btn active" onclick="switchTab('published')"><i class="fas fa-chart-line"></i> Published Results</button>
    <button class="tab-btn" onclick="switchTab('create')"><i class="fas fa-plus-circle"></i> Create Result</button>
  </div>
  <div id="publishedTab" class="tab-content active"><div id="resultsList">Loading...</div>
    <div id="rollInputSection" class="roll-input-section" style="display:none;">
      <h3 id="selectedExamName">Enter Roll Number</h3>
      <div class="input-group"><input type="text" id="rollInput" placeholder="Roll Number"><button onclick="fetchResult()">Get Result</button><button onclick="goBack()">Back</button></div>
    </div>
    <div id="resultCard" class="result-card" style="display:none;">
      <div class="result-card-header"><h2 id="resultExamName"></h2></div>
      <div class="student-info"><p><strong>Student:</strong> <span id="studentName"></span> | <strong>Roll:</strong> <span id="studentRoll"></span></p></div>
      <table class="marks-table"><thead><tr><th>Subject</th><th>Marks</th><th>Total</th><th>%</th></tr></thead><tbody id="marksBody"></tbody></table>
      <div class="percentage-display" id="totalPercent"></div>
      <div class="action-buttons"><button class="download-btn" onclick="downloadPDF()">Download PDF</button><button onclick="goBack()">Back</button></div>
    </div>
  </div>
  <div id="createTab" class="tab-content">
    <input type="text" id="examName" placeholder="Exam Name" style="width:100%; margin-bottom:10px;">
    <input type="date" id="examDate" style="width:100%; margin-bottom:10px;">
    <input type="text" id="subjects" placeholder="Subjects (comma: Hindi,English,Maths)" style="width:100%; margin-bottom:10px;">
    <textarea id="marksData" rows="5" placeholder='[{"rollNo":"101","name":"Ram","marks":{"Hindi":85,"English":90}}]' style="width:100%; margin-bottom:10px;"></textarea>
    <button onclick="publishResult()">Publish Result</button>
    <div id="publishStatus"></div>
  </div>
  <footer>Powered by GYAN SEVA — Result ki seva, Gyan ki seva</footer>
</div>

<script type="module">
  import { db } from './firebase-config.js';
  import { collection, addDoc, getDocs, query, where, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  const urlParams = new URLSearchParams(location.search); const coachingId = urlParams.get('id'); let currentResultId = null;
  async function loadCoaching() { if(!coachingId) return; const snap = await getDoc(doc(db, "coachings", coachingId)); if(snap.exists()) { const d=snap.data(); document.getElementById('coachingName').innerText=d.name||"GYAN SEVA"; document.getElementById('coachingLocation').innerText=d.location||"Bihar"; document.getElementById('directorName').innerHTML=`<i class="fas fa-user-tie"></i> ${d.director||'Director'}`; document.getElementById('directorPhone').innerHTML=`<i class="fas fa-phone"></i> ${d.phone||'Contact not set'}`; if(d.logo) document.getElementById('coachingLogo').src=d.logo; } loadResults(); }
  async function loadResults() { const snap = await getDocs(query(collection(db,"results"), where("coachingId","==",coachingId))); const container=document.getElementById('resultsList'); if(snap.empty){ container.innerHTML='<p>No results yet.</p>'; return; } let html=''; snap.forEach(d=>{ html+=`<div class="result-item" onclick="selectExam('${d.id}','${d.data().examName}')"><div><strong>${d.data().examName}</strong><br>${d.data().examDate}</div><i class="fas fa-chevron-right"></i></div>`; }); container.innerHTML=html; }
  window.selectExam=(id,name)=>{ currentResultId=id; document.getElementById('selectedExamName').innerHTML=`Enter Roll for: ${name}`; document.getElementById('resultsList').style.display='none'; document.getElementById('rollInputSection').style.display='block'; };
  window.fetchResult=async()=>{ const roll=document.getElementById('rollInput').value.trim(); if(!roll) return; const snap=await getDocs(collection(db,"results",currentResultId,"marks")); let student=null; snap.forEach(d=>{ if(d.id===roll) student=d.data(); }); if(!student){ alert("Not found"); return; } document.getElementById('rollInputSection').style.display='none'; document.getElementById('resultCard').style.display='block'; document.getElementById('studentName').innerText=student.name; document.getElementById('studentRoll').innerText=roll; let html='',total=0,count=0; for(let [sub,mark] of Object.entries(student.marks)){ html+=`<tr><td>${sub}</td><td>${mark}</td><td>100</td><td>${mark}%</td></tr>`; total+=mark; count++; } html+=`<tr style="background:#e8f5e8"><td><strong>Total</strong></td><td><strong>${total}</strong></td><td><strong>${count*100}</strong></td><td><strong>${(total/(count*100)*100).toFixed(2)}%</strong></td></tr>`; document.getElementById('marksBody').innerHTML=html; document.getElementById('totalPercent').innerText=`Percentage: ${(total/(count*100)*100).toFixed(2)}%`; };
  window.publishResult=async()=>{ const examName=document.getElementById('examName').value; const examDate=document.getElementById('examDate').value; const subjects=document.getElementById('subjects').value.split(','); const marks=JSON.parse(document.getElementById('marksData').value); const res=await addDoc(collection(db,"results"),{coachingId,examName,examDate,subjects,publishedAt:new Date().toISOString()}); for(let s of marks) await setDoc(doc(db,"results",res.id,"marks",s.rollNo),{name:s.name,marks:s.marks}); document.getElementById('publishStatus').innerHTML=`<p style="color:green;">✅ Published! <a href="dashboard.html?id=${coachingId}">Refresh</a></p>`; loadResults(); };
  window.goBack=()=>location.reload(); window.switchTab=(t)=>{ document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active')); document.getElementById(t+'Tab').classList.add('active'); }; window.downloadPDF=()=>window.print(); loadCoaching();
</script>
</body>
</html>
