<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>GYAN SEVA — Connect to Customer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', system-ui, sans-serif; }
    body { background:#ffffff; min-height:100vh; padding:40px 24px; }
    .container { max-width:1100px; margin:0 auto; }
    .nav-links { text-align:center; margin-bottom:30px; }
    .nav-links a { text-decoration:none; background:#f1f5f9; padding:8px 24px; border-radius:40px; margin:0 8px; color:#1e293b; font-weight:500; font-size:0.85rem; }
    .connect-card { background:#ffffff; border-radius:48px; box-shadow:0 20px 40px -12px rgba(0,0,0,0.08); border:1px solid #d1fae5; overflow:hidden; }
    .connect-header { background:#10b981; padding:28px 32px; text-align:center; }
    .connect-header h2 { color:white; font-size:2rem; font-weight:700; display:flex; align-items:center; justify-content:center; gap:12px; }
    .connect-header p { color:#ecfdf5; margin-top:8px; font-size:0.9rem; }
    .connect-body { padding:32px; }
    .stats-bar { background:#ecfdf5; border-radius:24px; padding:16px 20px; margin-bottom:28px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
    .stat-count { background:#10b981; color:white; padding:6px 16px; border-radius:40px; font-weight:600; }
    .refresh-btn { background:#f1f5f9; border:none; padding:8px 20px; border-radius:40px; cursor:pointer; font-weight:500; }
    .leads-container { max-height:550px; overflow-y:auto; }
    .lead-item { display:flex; justify-content:space-between; align-items:center; padding:16px 0; border-bottom:1px solid #e2e8f0; flex-wrap:wrap; gap:12px; }
    .lead-info strong { font-size:1rem; color:#1e293b; }
    .lead-info span { font-size:0.75rem; color:#64748b; }
    .btn-make-dashboard { background:#2563eb; color:white; padding:8px 18px; border-radius:40px; border:none; font-size:0.75rem; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
    .whatsapp-btn { background:#25D366; color:white; padding:8px 18px; border-radius:40px; text-decoration:none; font-size:0.75rem; font-weight:600; display:inline-flex; align-items:center; gap:6px; transition:0.2s; }
    .whatsapp-sent { background:#94a3b8; pointer-events:none; opacity:0.6; }
    .empty-state { text-align:center; padding:50px 20px; color:#94a3b8; }
    .pagination { display:flex; justify-content:center; gap:10px; margin-top:25px; flex-wrap:wrap; }
    .page-btn { background:#f1f5f9; border:none; padding:8px 14px; border-radius:30px; cursor:pointer; font-weight:500; }
    .page-btn.active { background:#10b981; color:white; }
    .toast { position:fixed; bottom:30px; right:30px; background:#1e293b; color:white; padding:12px 24px; border-radius:50px; font-size:0.85rem; z-index:1000; animation:fadeInOut 3s ease; }
    @keyframes fadeInOut { 0%{opacity:0;transform:translateY(20px);}15%{opacity:1;transform:translateY(0);}85%{opacity:1;}100%{opacity:0;transform:translateY(20px);} }
    footer { text-align:center; margin-top:40px; color:#94a3b8; font-size:0.75rem; }
    @media (max-width:640px){ .lead-item{ flex-direction:column; align-items:flex-start; } .btn-make-dashboard,.whatsapp-btn{ width:100%; justify-content:center; } }
  </style>
</head>
<body>
<div class="container">
  <div class="nav-links">
    <a href="index.html"><i class="fas fa-home"></i> Home</a>
    <a href="save-customer.html"><i class="fas fa-save"></i> Save Customer</a>
    <a href="connected.html"><i class="fas fa-handshake"></i> Connected Customers</a>
  </div>
  <div class="connect-card">
    <div class="connect-header"><h2><i class="fab fa-whatsapp"></i> CONNECT TO CUSTOMER</h2><p>Send WhatsApp messages — sent leads move to bottom</p></div>
    <div class="connect-body">
      <div class="stats-bar"><span><i class="fas fa-users"></i> <strong>Pending Leads</strong></span><span class="stat-count" id="leadCount">0</span><button class="refresh-btn" onclick="loadLeads()"><i class="fas fa-sync-alt"></i> Refresh</button></div>
      <div id="leadsList" class="leads-container"><div class="empty-state"><i class="fas fa-spinner fa-pulse"></i> Loading leads...</div></div>
      <div id="pagination" class="pagination"></div>
    </div>
  </div>
  <footer><i class="fas fa-heart" style="color:#10b981;"></i> GYAN SEVA — Connect, Convert, Serve</footer>
</div>
<script type="module">
  import { db } from './firebase-config.js';
  import { collection, addDoc, updateDoc, doc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  let allLeads = [], currentPage = 1, itemsPerPage = 10;
  let sentLeads = JSON.parse(localStorage.getItem('whatsapp_sent_leads') || '{}');
  function showToast(msg, isError=false){ let t=document.createElement('div'); t.className='toast'; t.style.background=isError?'#dc2626':'#10b981'; t.innerHTML=`<i class="fas ${isError?'fa-exclamation-triangle':'fa-check-circle'}"></i> ${msg}`; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }
  window.markAsSent = (leadId) => { sentLeads[leadId]=true; localStorage.setItem('whatsapp_sent_leads',JSON.stringify(sentLeads)); showToast('✅ Marked as sent. Lead will move to bottom.'); loadLeads(); };
  window.createDashboard = async (leadId, leadName, leadPhone, leadCity, btn) => {
    btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-pulse"></i>';
    const coachingRef = await addDoc(collection(db, "coachings"), { name:leadName, phone:leadPhone, city:leadCity||"", director:"", location:leadCity||"", logo:"", createdAt:new Date().toISOString(), dashboardCreated:true });
    await updateDoc(doc(db, "leads", leadId), { status:"connected", coachingId:coachingRef.id, connectedAt:new Date().toISOString() });
    showToast(`✅ ${leadName} dashboard created!`);
    loadLeads();
  };
  function renderPage(){
    const container=document.getElementById('leadsList'), totalPages=Math.ceil(allLeads.length/itemsPerPage);
    if(allLeads.length===0){ container.innerHTML='<div class="empty-state"><i class="fas fa-check-circle"></i><br>No pending leads!</div>'; document.getElementById('pagination').innerHTML=''; return; }
    const start=(currentPage-1)*itemsPerPage, end=start+itemsPerPage, pageLeads=allLeads.slice(start,end);
    let html='';
    for(const lead of pageLeads){
      const isSent=sentLeads[lead.id]===true;
      const waMsg=`नमस्ते ${lead.name} sir,%0A%0AThis is GYAN SEVA. We provide FREE DEMO result portal for coaching.%0A%0A✅ Online result system%0A✅ Students can check marks%0A✅ PDF download%0A%0A🔰 FREE trial for 1 month.%0A%0AInterested? Reply "YES".%0A%0AThank you%0AGYAN SEVA Team`;
      const waLink=`https://wa.me/91${lead.phone}?text=${waMsg}`;
      html+=`<div class="lead-item"><div class="lead-info"><strong>🏫 ${lead.name}</strong><br><span>📞 ${lead.phone} | 📍 ${lead.city||''}</span></div><div style="display:flex; gap:8px; flex-wrap:wrap;"><button class="btn-make-dashboard" onclick="createDashboard('${lead.id}','${lead.name.replace(/'/g,"\\'")}','${lead.phone}','${lead.city||''}',this)"><i class="fas fa-magic"></i> Make Dashboard</button><a href="${waLink}" target="_blank" class="whatsapp-btn ${isSent?'whatsapp-sent':''}" onclick="${isSent?'return false;':'markAsSent(\''+lead.id+'\')'}"><i class="fab fa-whatsapp"></i> ${isSent?'Sent':'Message'}</a></div></div>`;
    }
    container.innerHTML=html;
    if(totalPages>1){ let pgHtml=''; for(let i=1;i<=totalPages;i++) pgHtml+=`<button class="page-btn ${i===currentPage?'active':''}" onclick="goToPage(${i})">${i}</button>`; document.getElementById('pagination').innerHTML=pgHtml; }
    else document.getElementById('pagination').innerHTML='';
    document.getElementById('leadCount').innerText=allLeads.length;
  }
  window.goToPage=(page)=>{ currentPage=page; renderPage(); };
  window.loadLeads=async()=>{
    const snap=await getDocs(query(collection(db,"leads"), where("status","==","pending")));
    let leads=[];
    snap.forEach(d=>leads.push({id:d.id,...d.data()}));
    allLeads=leads.sort((a,b)=>{ let aSent=sentLeads[a.id]===true, bSent=sentLeads[b.id]===true; return aSent===bSent?0:aSent?1:-1; });
    currentPage=1; renderPage();
  };
  loadLeads(); setInterval(loadLeads,15000);
</script>
</body>
</html>
