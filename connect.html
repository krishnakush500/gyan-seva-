<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>GYAN SEVA — Connect to Customer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', system-ui, sans-serif; }
    body { background:#ffffff; min-height:100vh; padding:40px 24px; }
    .container { max-width:1200px; margin:0 auto; }
    .nav-links { text-align:center; margin-bottom:30px; }
    .nav-links a { text-decoration:none; background:#f1f5f9; padding:8px 24px; border-radius:40px; margin:0 8px; color:#1e293b; font-weight:500; font-size:0.85rem; }
    .connect-card { background:#ffffff; border-radius:48px; box-shadow:0 20px 40px -12px rgba(0,0,0,0.08); border:1px solid #d1fae5; overflow:hidden; }
    .connect-header { background:#10b981; padding:28px 32px; text-align:center; }
    .connect-header h2 { color:white; font-size:2rem; font-weight:700; display:flex; align-items:center; justify-content:center; gap:12px; }
    .connect-header p { color:#ecfdf5; margin-top:8px; font-size:0.9rem; }
    .connect-body { padding:32px; }
    .stats-bar { background:#ecfdf5; border-radius:24px; padding:16px 20px; margin-bottom:28px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
    .stat-count { background:#10b981; color:white; padding:6px 16px; border-radius:40px; font-weight:600; }
    .refresh-btn { background:#f1f5f9; border:none; padding:8px 20px; border-radius:40px; cursor:pointer; font-weight:500; }
    .leads-container { max-height:550px; overflow-y:auto; }
    .lead-item { display:flex; justify-content:space-between; align-items:center; padding:16px 0; border-bottom:1px solid #e2e8f0; flex-wrap:wrap; gap:12px; }
    .lead-info strong { font-size:1rem; color:#1e293b; }
    .lead-info span { font-size:0.75rem; color:#64748b; }
    .whatsapp-btn { background:#25D366; color:white; padding:8px 24px; border-radius:40px; text-decoration:none; font-size:0.85rem; font-weight:600; display:inline-flex; align-items:center; gap:8px; transition:0.2s; }
    .whatsapp-btn.sent { background:#94a3b8; cursor:default; pointer-events:none; }
    .whatsapp-btn:hover { transform:scale(0.97); }
    .empty-state { text-align:center; padding:50px 20px; color:#94a3b8; }
    .toast { position:fixed; bottom:30px; right:30px; background:#1e293b; color:white; padding:12px 24px; border-radius:50px; font-size:0.85rem; z-index:1000; animation:fadeInOut 3s ease; }
    @keyframes fadeInOut { 0% { opacity:0; transform:translateY(20px); } 15% { opacity:1; transform:translateY(0); } 85% { opacity:1; } 100% { opacity:0; transform:translateY(20px); } }
    
    /* Pagination Styles */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px solid #e2e8f0;
    }
    .pagination button {
      background: #1a237e;
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 600;
    }
    .pagination button:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
    }
    .pagination span {
      color: #1e293b;
      font-weight: 500;
    }
    
    footer { text-align:center; margin-top:40px; color:#94a3b8; font-size:0.75rem; }
  </style>
</head>
<body>

<div class="container">
  <div class="nav-links">
    <a href="index.html"><i class="fas fa-home"></i> Home</a>
    <a href="save-customer.html"><i class="fas fa-save"></i> Save Customer</a>
    <a href="connected.html"><i class="fas fa-handshake"></i> Connected Customers</a>
  </div>

  <div class="connect-card">
    <div class="connect-header">
      <h2><i class="fab fa-whatsapp"></i> CONNECT TO CUSTOMER</h2>
      <p>Send WhatsApp messages to pending leads — one click away</p>
    </div>
    <div class="connect-body">
      <div class="stats-bar">
        <span><i class="fas fa-users"></i> <strong>Total Pending Leads</strong></span>
        <span class="stat-count" id="leadCount">0</span>
        <button class="refresh-btn" onclick="loadLeads()"><i class="fas fa-sync-alt"></i> Refresh</button>
      </div>
      <div id="leadsList" class="leads-container"><div class="empty-state"><i class="fas fa-spinner fa-pulse"></i> Loading leads...</div></div>
      
      <!-- Pagination Controls -->
      <div class="pagination" id="paginationControls" style="display:none;">
        <button id="prevPageBtn" onclick="changePage(-1)"><i class="fas fa-chevron-left"></i> Previous</button>
        <span id="pageInfo">Page 1 of 1</span>
        <button id="nextPageBtn" onclick="changePage(1)">Next <i class="fas fa-chevron-right"></i></button>
      </div>
    </div>
  </div>
  <footer><i class="fas fa-heart" style="color:#10b981;"></i> GYAN SEVA — Connect, Convert, Serve</footer>
</div>

<script type="module">
  import { db } from './firebase-config.js';
  import { collection, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  let allLeads = [];           // Store all pending leads
  let sentLeads = JSON.parse(localStorage.getItem('sentLeads') || '{}');  // Track sent leads { phone: true }
  let currentPage = 1;
  const itemsPerPage = 10;

  function showToast(message, isError = false) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.style.background = isError ? '#dc2626' : '#10b981';
    toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i> ${message}`;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  // Mark lead as sent and update UI
  window.markAsSent = async (leadId, phone, leadName) => {
    // Update local storage
    sentLeads[phone] = true;
    localStorage.setItem('sentLeads', JSON.stringify(sentLeads));
    
    // Update Firebase lead status
    try {
      const leadRef = doc(db, "leads", leadId);
      await updateDoc(leadRef, { status: "connected", connectedAt: new Date().toISOString() });
      showToast(`✅ Message sent to ${leadName}`);
    } catch(e) {
      console.error("Error updating lead:", e);
    }
    
    // Refresh the list (lead will move down)
    loadLeads();
  };

  // Load leads from Firebase and sort (pending first, then sent)
  async function loadLeads() {
    try {
      const leadsRef = collection(db, "leads");
      const snapshot = await getDocs(leadsRef);
      const leads = [];
      
      snapshot.forEach(docSnap => {
        const lead = docSnap.data();
        if (lead.status === "pending") {
          const isSent = sentLeads[lead.phone] === true;
          leads.push({ id: docSnap.id, ...lead, isSent });
        }
      });
      
      // Sort: Not sent first (upar), sent later (neeche)
      leads.sort((a, b) => {
        if (a.isSent === b.isSent) return 0;
        if (!a.isSent && b.isSent) return -1;  // Not sent goes up
        return 1;  // Sent goes down
      });
      
      allLeads = leads;
      document.getElementById('leadCount').innerText = leads.length;
      
      if (leads.length === 0) {
        document.getElementById('leadsList').innerHTML = `<div class="empty-state"><i class="fas fa-check-circle"></i><br>No pending leads!<br>All leads are processed.<br><br>👉 Go to "Save Customer" to import new leads.</div>`;
        document.getElementById('paginationControls').style.display = 'none';
        return;
      }
      
      displayCurrentPage();
      document.getElementById('paginationControls').style.display = 'flex';
      
    } catch (error) {
      console.error("Error loading leads:", error);
      document.getElementById('leadsList').innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><br>Error loading leads</div>`;
    }
  }

  // Display current page's leads
  function displayCurrentPage() {
    const startIndex = (currentPage - 1) * itemsPerPage;
    const endIndex = startIndex + itemsPerPage;
    const pageLeads = allLeads.slice(startIndex, endIndex);
    
    const container = document.getElementById('leadsList');
    const totalPages = Math.ceil(allLeads.length / itemsPerPage);
    
    // Update pagination info
    document.getElementById('pageInfo').innerHTML = `Page ${currentPage} of ${totalPages}`;
    document.getElementById('prevPageBtn').disabled = currentPage === 1;
    document.getElementById('nextPageBtn').disabled = currentPage === totalPages;
    
    if (pageLeads.length === 0) {
      container.innerHTML = '<div class="empty-state">No leads on this page</div>';
      return;
    }
    
    let html = '';
    for (const lead of pageLeads) {
      const isSent = lead.isSent;
      const whatsappMessage = `नमस्ते ${lead.name} sir,%0A%0AThis is GYAN SEVA. We provide FREE DEMO result portal for coaching.%0A%0A✅ Online result system%0A✅ Students can check marks with roll number%0A✅ PDF download option%0A%0A🔰 Completely FREE trial for 1 month.%0A🔰 No technical knowledge required.%0A%0AInterested? Reply "YES" to get your demo portal.%0A%0AThank you%0AGYAN SEVA Team`;
      const waLink = `https://wa.me/91${lead.phone}?text=${whatsappMessage}`;
      
      // Different button styles: sent = grey, not sent = green
      const buttonClass = isSent ? 'whatsapp-btn sent' : 'whatsapp-btn';
      const buttonHtml = isSent 
        ? `<button class="${buttonClass}" disabled><i class="fas fa-check-circle"></i> Message Sent</button>`
        : `<a href="${waLink}" target="_blank" class="${buttonClass}" onclick="markAsSent('${lead.id}', '${lead.phone}', '${lead.name.replace(/'/g, "\\'")}')"><i class="fab fa-whatsapp"></i> Send WhatsApp</a>`;
      
      html += `
        <div class="lead-item" data-sent="${isSent}">
          <div class="lead-info">
            <strong>🏫 ${lead.name}</strong><br>
            <span>📞 ${lead.phone} | 📍 ${lead.city || 'Location not available'}</span>
          </div>
          ${buttonHtml}
        </div>
      `;
    }
    
    container.innerHTML = html;
  }

  // Change page
  window.changePage = (direction) => {
    const totalPages = Math.ceil(allLeads.length / itemsPerPage);
    const newPage = currentPage + direction;
    if (newPage >= 1 && newPage <= totalPages) {
      currentPage = newPage;
      displayCurrentPage();
    }
  };

  // Initial load
  loadLeads();
  
  // Auto refresh every 15 seconds
  setInterval(loadLeads, 15000);
</script>
</body>
</html>
