<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>GYAN SEVA — Connect to Customer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', system-ui, sans-serif; }
    body { background:#ffffff; min-height:100vh; padding:40px 24px; }
    .container { max-width:1100px; margin:0 auto; }
    .nav-links { text-align:center; margin-bottom:30px; }
    .nav-links a { text-decoration:none; background:#f1f5f9; padding:8px 24px; border-radius:40px; margin:0 8px; color:#1e293b; font-weight:500; font-size:0.85rem; }
    .connect-card { background:#ffffff; border-radius:48px; box-shadow:0 20px 40px -12px rgba(0,0,0,0.08); border:1px solid #d1fae5; overflow:hidden; }
    .connect-header { background:#10b981; padding:28px 32px; text-align:center; }
    .connect-header h2 { color:white; font-size:2rem; font-weight:700; display:flex; align-items:center; justify-content:center; gap:12px; }
    .connect-header p { color:#ecfdf5; margin-top:8px; font-size:0.9rem; }
    .connect-body { padding:32px; }
    .quick-lead-form { background:#f8fafc; border:1px solid #dbeafe; border-radius:20px; padding:20px; margin-bottom:22px; }
    .quick-lead-form h3 { color:#1e293b; font-size:1rem; margin-bottom:14px; }
    .quick-lead-fields { display:grid; grid-template-columns:1fr 1fr auto; gap:12px; align-items:end; }
    .quick-lead-fields label { display:block; color:#475569; font-size:0.78rem; font-weight:600; margin-bottom:6px; }
    .quick-lead-fields input { width:100%; padding:11px 12px; border:1px solid #cbd5e1; border-radius:10px; font-size:0.9rem; }
    .btn-save-lead { background:#10b981; color:#fff; padding:11px 18px; border:0; border-radius:10px; font-weight:600; cursor:pointer; white-space:nowrap; }
    .btn-save-lead:hover { background:#059669; }
    
    .btn-add-school { background:#10b981; color:white; padding:12px 24px; border-radius:40px; border:none; font-size:0.9rem; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:8px; margin-bottom:20px; }
    .btn-add-school:hover { background:#059669; }
    
    .stats-bar { background:#ecfdf5; border-radius:24px; padding:16px 20px; margin-bottom:28px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
    .stat-count { background:#10b981; color:white; padding:6px 16px; border-radius:40px; font-weight:600; }
    .refresh-btn { background:#f1f5f9; border:none; padding:8px 20px; border-radius:40px; cursor:pointer; font-weight:500; }
    .leads-container { max-height:550px; overflow-y:auto; }
    .lead-item { display:flex; justify-content:space-between; align-items:center; padding:16px 0; border-bottom:1px solid #e2e8f0; flex-wrap:wrap; gap:12px; }
    .lead-info strong { font-size:1rem; color:#1e293b; }
    .lead-info span { font-size:0.75rem; color:#64748b; }
    .btn-make-dashboard { background:#2563eb; color:white; padding:8px 18px; border-radius:40px; border:none; font-size:0.75rem; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
    .btn-remove { background:#dc2626; color:white; padding:8px 18px; border-radius:40px; border:none; font-size:0.75rem; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
    .whatsapp-btn { background:#25D366; color:white; padding:8px 18px; border-radius:40px; text-decoration:none; font-size:0.75rem; font-weight:600; display:inline-flex; align-items:center; gap:6px; transition:0.2s; }
    .whatsapp-sent { background:#94a3b8; pointer-events:none; }
    .whatsapp-reminder { background:#f59e0b; }
    .empty-state { text-align:center; padding:50px 20px; color:#94a3b8; }
    .pagination { display:flex; justify-content:center; gap:10px; margin-top:25px; flex-wrap:wrap; }
    .page-btn { background:#f1f5f9; border:none; padding:8px 14px; border-radius:30px; cursor:pointer; font-weight:500; }
    .page-btn.active { background:#10b981; color:white; }
    .toast { position:fixed; bottom:30px; right:30px; background:#1e293b; color:white; padding:12px 24px; border-radius:50px; font-size:0.85rem; z-index:1000; animation:fadeInOut 3s ease; }
    @keyframes fadeInOut { 0%{opacity:0;transform:translateY(20px);}15%{opacity:1;transform:translateY(0);}85%{opacity:1;}100%{opacity:0;transform:translateY(20px);} }
    footer { text-align:center; margin-top:40px; color:#94a3b8; font-size:0.75rem; }
    @media (max-width:640px){ .lead-item{ flex-direction:column; align-items:flex-start; } .btn-make-dashboard,.whatsapp-btn,.btn-remove{ width:100%; justify-content:center; } .quick-lead-fields{grid-template-columns:1fr;} .btn-save-lead{width:100%;} }
    
    /* Modal Styles */
    .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1000; justify-content:center; align-items:center; }
    .modal-content { background:white; border-radius:32px; padding:28px; max-width:550px; width:90%; max-height:90vh; overflow-y:auto; }
    .modal-content h3 { margin-bottom:10px; color:#1e293b; display:flex; align-items:center; gap:10px; }
    .modal-content label { display:block; font-weight:600; margin-top:15px; color:#1e293b; }
    .modal-content input { width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:12px; font-size:0.9rem; }
    .logo-upload-area {
      border: 2px dashed #ddd;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
      margin: 8px 0;
      background: #fafafa;
    }
    .logo-upload-area:hover { border-color: #10b981; background: #f0fdf4; }
    .logo-upload-area img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin: 10px auto; display: block; }
    .logo-upload-area p { color: #888; font-size: 0.85rem; }
    
    .modal-buttons { display:flex; gap:12px; margin-top:20px; justify-content:flex-end; }
    .modal-buttons button { padding:10px 20px; border-radius:40px; border:none; cursor:pointer; font-weight:600; }
    .btn-cancel { background:#94a3b8; color:white; }
    .btn-submit { background:#10b981; color:white; }
    .btn-submit:hover { background:#059669; }
    .btn-generate { background:#f59e0b; color:white; padding:8px 16px; border-radius:30px; border:none; cursor:pointer; font-weight:600; }
    .search-code-box { background:#f1f5f9; padding:12px; border-radius:12px; text-align:center; font-size:1.3rem; font-weight:700; color:#1a237e; margin:10px 0; display:none; }
  </style>
</head>
<body>

<div class="container">
  <div class="nav-links">
    <a href="index.html"><i class="fas fa-home"></i> Home</a>
    <a href="save-customer.html"><i class="fas fa-save"></i> Save Customer</a>
    <a href="connected.html"><i class="fas fa-handshake"></i> Connected Customers</a>
  </div>
  <div class="connect-card">
    <div class="connect-header"><h2><i class="fab fa-whatsapp"></i> CONNECT TO CUSTOMER</h2><p>Send messages — sent leads move to bottom</p></div>
    <div class="connect-body">
      <form class="quick-lead-form" onsubmit="savePendingLead(event)">
        <h3><i class="fas fa-user-plus" style="color:#10b981;"></i> Add a coaching to pending leads</h3>
        <div class="quick-lead-fields">
          <div>
            <label for="pendingLeadName">Coaching name</label>
            <input id="pendingLeadName" type="text" placeholder="e.g. Bright Future Coaching" maxlength="80" required>
          </div>
          <div>
            <label for="pendingLeadPhone">Teacher WhatsApp number</label>
            <input id="pendingLeadPhone" type="tel" inputmode="tel" placeholder="10-digit mobile number" maxlength="16" required>
          </div>
          <button id="savePendingLeadButton" class="btn-save-lead" type="submit"><i class="fas fa-save"></i> Save Lead</button>
        </div>
      </form>

      <button class="btn-add-school" onclick="openAddSchoolModal()">
        <i class="fas fa-plus-circle"></i> Add Customer
      </button>

      <div class="stats-bar"><span><i class="fas fa-users"></i> <strong>Pending Leads</strong></span><span class="stat-count" id="leadCount">0</span><button class="refresh-btn" onclick="loadLeads()"><i class="fas fa-sync-alt"></i> Refresh</button></div>
      <div id="leadsList" class="leads-container"><div class="empty-state"><i class="fas fa-spinner fa-pulse"></i> Loading leads...</div></div>
      <div id="pagination" class="pagination"></div>
    </div>
  </div>
  <footer><i class="fas fa-heart" style="color:#10b981;"></i> GYAN SEVA — Connect, Convert, Serve</footer>
</div>

<!-- Add a customer with the basic details first -->
<div id="addSchoolModal" class="modal">
  <div class="modal-content">
    <h3><i class="fas fa-user-plus" style="color:#10b981;"></i> Add Customer to Pending Leads</h3>
    <p style="color:#666; font-size:0.85rem;">Coaching name and WhatsApp number are enough for now.</p>
    
    <label>🏫 Coaching / School Name</label>
    <input type="text" id="addSchoolName" placeholder="e.g., Modern Academy" maxlength="25">
    
    <label>📞 Phone Number</label>
    <input type="tel" id="addSchoolPhone" inputmode="tel" placeholder="10-digit mobile number" maxlength="16">
    
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeAddSchoolModal()">Cancel</button>
      <button class="btn-submit" onclick="saveSchoolToFirebase()"><i class="fas fa-save"></i> Save Lead</button>
    </div>
  </div>
</div>

<script type="module">
  import { db, auth } from './firebase-config.js';
  import { collection, addDoc, updateDoc, deleteDoc, doc, getDocs, query, where, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  
  // Supabase Config (same as mobile app)
  const SUPABASE_URL = "https://qfmmgeodabytpuzkarrb.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmbW1nZW9kYWJ5dHB1emthcnJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNzQyMDEsImV4cCI6MjA4Njg1MDIwMX0._NxbC8_P3GQWRMyqNZgneC7lYWDTvEpekt40ZFRmtJk";
  
  let allLeads = [], currentPage = 1, itemsPerPage = 10;
  let leadStatus = JSON.parse(localStorage.getItem('lead_status') || '{}');
  let templates = {};
  const defaultTeacherOutreachMessage = `Hello {name} Sir,\n\nGYAN SEVA helps coaching centres share exam results online. Students can check results using their roll number.\n\nSee a sample: https://krishnakush500.github.io/Quest-Coaching-Centre/\n\nOne-time setup: ₹499.\nReply YES to get started.\n- GYAN SEVA`;
  const oldTeacherOutreachMessage = `नमस्ते {name} sir,\n\nThis is GYAN SEVA. We provide FREE DEMO result portal for coaching.\n\n✅ Online result system\n✅ Students can check marks with roll number\n✅ PDF download option\n\n🔰 Completely FREE trial for 1 month.\n🔰 No technical knowledge required.\n\nInterested? Reply "YES" to get your demo portal.\n\nThank you\nGYAN SEVA Team`;
  let generatedCode = null;
  let selectedLogoFile = null;

  // ===== LOGO UPLOAD FUNCTIONS =====
  window.previewLogo = (event) => {
    const file = event.target.files[0];
    if(file) {
      selectedLogoFile = file;
      const reader = new FileReader();
      reader.onload = (e) => {
        document.getElementById('logoPreview').src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
  };

  // Upload to Supabase
  async function uploadToSupabase(file) {
    const fileName = `logo_${Date.now()}_${Math.random().toString(36).substr(2, 6)}.jpg`;
    const formData = new FormData();
    formData.append('file', file);
    
    try {
      const response = await fetch(`${SUPABASE_URL}/storage/v1/object/logos/${fileName}`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'apikey': SUPABASE_KEY
        },
        body: formData
      });
      
      if(!response.ok) {
        const err = await response.text();
        throw new Error(err || 'Upload failed');
      }
      
      const imageUrl = `${SUPABASE_URL}/storage/v1/object/public/logos/${fileName}`;
      return imageUrl;
    } catch(error) {
      console.error('Upload error:', error);
      throw error;
    }
  }

  // ===== SCHOOL ADD FUNCTIONS =====
  window.openAddSchoolModal = () => {
    document.getElementById('addSchoolModal').style.display = 'flex';
    document.getElementById('addSchoolName').value = '';
    document.getElementById('addSchoolLocation').value = '';
    document.getElementById('addSchoolDirector').value = '';
    document.getElementById('addSchoolPhone').value = '';
    document.getElementById('logoPreview').src = 'https://via.placeholder.com/80?text=Logo';
    document.getElementById('searchCodeBox').style.display = 'none';
    document.getElementById('logoInput').value = '';
    selectedLogoFile = null;
    generatedCode = null;
  };

  window.closeAddSchoolModal = () => {
    document.getElementById('addSchoolModal').style.display = 'none';
  };

  window.generateCodeForSchool = () => {
    const code = Math.floor(100000 + Math.random() * 900000).toString();
    generatedCode = code;
    const box = document.getElementById('searchCodeBox');
    box.textContent = code;
    box.style.display = 'block';
  };

  window.saveSchoolToFirebase = async () => {
    const name = document.getElementById('addSchoolName').value.trim();
    const location = document.getElementById('addSchoolLocation').value.trim();
    const director = document.getElementById('addSchoolDirector').value.trim();
    const phone = document.getElementById('addSchoolPhone').value.trim();

    if(!name || !location || !director || !phone) {
      alert('Please fill all required fields');
      return;
    }

    if(!generatedCode) {
      alert('Please generate a search code first');
      return;
    }

    const user = auth.currentUser;
    if(!user) {
      alert('Please login first');
      return;
    }

    const userId = user.uid;
    let logoUrl = '';

    if(selectedLogoFile) {
      try {
        logoUrl = await uploadToSupabase(selectedLogoFile);
        alert('✅ Logo uploaded successfully!');
      } catch(error) {
        alert('Logo upload failed: ' + error.message);
        return;
      }
    }

    const schoolData = {
      coachingName: name,
      location: location,
      director: director,
      phone: phone,
      logoUrl: logoUrl,
      searchCode: generatedCode,
      createdBy: userId,
      createdAt: Date.now(),
      subscriptionStatus: 'active',
      subscriptionPlan: 'free_trial'
    };

    try {
      await setDoc(doc(db, "schools", userId), schoolData);
      await setDoc(doc(db, "schools", userId, "teachers", userId), {
        name: director,
        email: user.email || '',
        role: 'director',
        joinedAt: Date.now(),
        isActive: true
      });
      alert('✅ Institute created successfully!\nSearch Code: ' + generatedCode);
      closeAddSchoolModal();
    } catch(error) {
      alert('Error saving: ' + error.message);
    }
  };

  // ===== ORIGINAL CONNECT FUNCTIONS =====
  function showToast(msg, isError=false){ let t=document.createElement('div'); t.className='toast'; t.style.background=isError?'#dc2626':'#10b981'; t.innerHTML=`<i class="fas ${isError?'fa-exclamation-triangle':'fa-check-circle'}"></i> ${msg}`; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }

  window.removeLead = async (leadId, leadName) => {
    if(confirm(`Remove "${leadName}" from pending leads?`)) {
      await deleteDoc(doc(db, "leads", leadId));
      delete leadStatus[leadId];
      localStorage.setItem('lead_status', JSON.stringify(leadStatus));
      showToast(`✅ "${leadName}" removed`);
      loadLeads();
    }
  };

  async function loadTemplates() {
    try {
      const docRef = doc(db, "templates", "whatsapp_templates");
      const docSnap = await getDoc(docRef);
      if(docSnap.exists()) {
        templates = docSnap.data();
        if (templates.template1 === oldTeacherOutreachMessage) {
          templates.template1 = defaultTeacherOutreachMessage;
        }
      } else {
        templates = {
          template1: defaultTeacherOutreachMessage,
          template2: "👋 GYAN SEVA\n\nHello {name},\n\nJust a gentle reminder about FREE DEMO for your institute.\n\nYour students can check online result with roll number.\n\nReply YES to get your free demo link.\n\nThank you\nGYAN SEVA"
        };
      }
    } catch(e) { console.error("Error loading templates:", e); }
  }

  function getMessage(leadName, type) {
    if (type === 'reminder') {
      return (templates.template2 || templates.template1).replace(/{name}/g, leadName);
    } else {
      return (templates.template1 || templates.template2).replace(/{name}/g, leadName);
    }
  }

  window.markLeadAction = async (leadId, leadName, leadPhone, action) => {
    if(action === 'sent') {
      leadStatus[leadId] = 'sent';
      localStorage.setItem('lead_status', JSON.stringify(leadStatus));
      showToast('✅ First message sent! Now you can send reminder.');
    } else if(action === 'reminder') {
      leadStatus[leadId] = 'reminder_sent';
      localStorage.setItem('lead_status', JSON.stringify(leadStatus));
      showToast('📢 Reminder sent!');
    }
    loadLeads();
  };

  window.savePendingLead = async (event) => {
    event.preventDefault();
    const name = document.getElementById('pendingLeadName').value.trim();
    const phoneInput = document.getElementById('pendingLeadPhone').value.trim();
    const phoneDigits = phoneInput.replace(/\D/g, '');
    const phone = phoneDigits.startsWith('91') && phoneDigits.length === 12
      ? phoneDigits.slice(2)
      : phoneDigits.startsWith('0') && phoneDigits.length === 11
        ? phoneDigits.slice(1)
        : phoneDigits;

    if (!name || phone.length !== 10) {
      showToast('Enter a coaching name and a valid 10-digit Indian mobile number.', true);
      return;
    }

    const saveButton = document.getElementById('savePendingLeadButton');
    saveButton.disabled = true;
    saveButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
    try {
      await addDoc(collection(db, 'leads'), {
        name,
        phone,
        city: '',
        status: 'pending',
        source: 'manual',
        createdAt: Date.now()
      });
      document.getElementById('pendingLeadName').value = '';
      document.getElementById('pendingLeadPhone').value = '';
      showToast(`✅ ${name} added to pending leads`);
      await loadLeads();
    } catch (error) {
      console.error('Could not save pending lead:', error);
      showToast('Could not save lead. Please try again.', true);
    } finally {
      saveButton.disabled = false;
      saveButton.innerHTML = '<i class="fas fa-save"></i> Save Lead';
    }
  };

  function getWhatsAppLink(leadId, leadName, leadPhone, currentStatus) {
    let template, actionType;
    if(currentStatus === 'sent') {
      template = getMessage(leadName, 'reminder');
      actionType = 'reminder';
    } else {
      template = getMessage(leadName, 'first');
      actionType = 'sent';
    }
    const encodedMsg = encodeURIComponent(template);
    const waPhoneDigits = String(leadPhone || '').replace(/\D/g, '');
    const waPhone = waPhoneDigits.length === 10 ? `91${waPhoneDigits}` : waPhoneDigits;
    const waLink = `https://api.whatsapp.com/send/?phone=${waPhone}&text=${encodedMsg}`;
    return { waLink, actionType };
  }

  // ===== CREATE DASHBOARD (WITH FAKE RESULTS) =====
  window.createDashboard = async (leadId, leadName, leadPhone, leadCity, btn) => {
    btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-pulse"></i>';
    try {
      const coachingRef = await addDoc(collection(db, "coachings"), { 
        name: leadName, phone: leadPhone, city: leadCity||"", director: "", location: leadCity||"", logo: "", createdAt: new Date().toISOString(), dashboardCreated: true 
      });
      
      const fakeResults = [
        { examName: "📘 Demo Exam 1 - Monthly Test", examDate: "2025-01-15", subjects: ["Mathematics", "Science", "English", "Social Science"], roll: "101", studentName: "Aryan Kumar", fatherName: "Rajesh Singh", marks: {"Mathematics":85, "Science":78, "English":82, "Social Science":88} },
        { examName: "📙 Demo Exam 2 - Half Yearly", examDate: "2024-12-20", subjects: ["Mathematics", "Science", "English", "Hindi", "SST"], roll: "202", studentName: "Priya Singh", fatherName: "Mohan Singh", marks: {"Mathematics":92, "Science":88, "English":85, "Hindi":90, "SST":87} },
        { examName: "📕 Demo Exam 3 - Pre-Board", examDate: "2025-02-10", subjects: ["Physics", "Chemistry", "Mathematics", "Biology"], roll: "303", studentName: "Rohan Verma", fatherName: "Suresh Verma", marks: {"Physics":75, "Chemistry":80, "Mathematics":88, "Biology":79} }
      ];
      
      for (const exam of fakeResults) {
        const resultsRef = collection(db, "coachings", coachingRef.id, "results");
        const newResult = await addDoc(resultsRef, {
          examName: exam.examName,
          examDate: exam.examDate,
          subjects: exam.subjects,
          publishedAt: new Date().toISOString(),
          totalStudents: 1,
          isDemo: true
        });
        const total = Object.values(exam.marks).reduce((a,b)=>a+b,0);
        const percentage = (total / (exam.subjects.length * 100)) * 100;
        await setDoc(doc(db, "coachings", coachingRef.id, "results", newResult.id, "marks", exam.roll), {
          name: exam.studentName,
          fatherName: exam.fatherName,
          marks: exam.marks,
          total: total,
          percentage: percentage.toFixed(2),
          isDemo: true
        });
      }
      
      await updateDoc(doc(db, "leads", leadId), { status:"connected", coachingId:coachingRef.id, connectedAt:new Date().toISOString() });
      showToast(`✅ ${leadName} dashboard created with 3 demo results!`);
      loadLeads();
    } catch(error) {
      showToast(`❌ Failed: ${error.message}`, true);
      btn.disabled=false; btn.innerHTML='<i class="fas fa-magic"></i> Make Dashboard';
    }
  };

  function renderPage(){
    const container=document.getElementById('leadsList'), totalPages=Math.ceil(allLeads.length/itemsPerPage);
    if(allLeads.length===0){ container.innerHTML='<div class="empty-state"><i class="fas fa-check-circle"></i><br>No pending leads!</div>'; document.getElementById('pagination').innerHTML=''; return; }
    const start=(currentPage-1)*itemsPerPage, end=start+itemsPerPage, pageLeads=allLeads.slice(start,end);
    let html='';
    for(const lead of pageLeads){
      const currentStatus = leadStatus[lead.id];
      let btnClass = 'whatsapp-btn';
      let btnText = 'Message';
      let action = 'sent';
      
      if(currentStatus === 'sent') {
        btnClass = 'whatsapp-btn whatsapp-reminder';
        btnText = 'Reminder';
        action = 'reminder';
      } else if(currentStatus === 'reminder_sent') {
        btnClass = 'whatsapp-btn whatsapp-sent';
        btnText = 'Sent';
        action = null;
      }
      
      const { waLink, actionType } = currentStatus === 'reminder_sent' ? 
        { waLink: '#', actionType: null } : 
        getWhatsAppLink(lead.id, lead.name, lead.phone, currentStatus);
      
      const isDisabled = currentStatus === 'reminder_sent';
      
      html+=`<div class="lead-item"><div class="lead-info"><strong>🏫 ${lead.name}</strong><br><span>📞 ${lead.phone} | 📍 ${lead.city||''}</span></div><div style="display:flex; gap:8px; flex-wrap:wrap;"><button class="btn-make-dashboard" onclick="createDashboard('${lead.id}','${lead.name.replace(/'/g,"\\'")}','${lead.phone}','${lead.city||''}',this)"><i class="fas fa-magic"></i> Make Dashboard</button>${isDisabled ? `<span class="whatsapp-btn whatsapp-sent"><i class="fas fa-check"></i> Done</span>` : `<a href="${waLink}" target="_blank" class="${btnClass}" onclick="markLeadAction('${lead.id}','${lead.name.replace(/'/g,"\\'")}','${lead.phone}','${actionType}')"><i class="fab fa-whatsapp"></i> ${btnText}</a>`}<button class="btn-remove" onclick="removeLead('${lead.id}','${lead.name.replace(/'/g,"\\'")}')"><i class="fas fa-trash-alt"></i> Remove</button></div></div>`;
    }
    container.innerHTML=html;
    if(totalPages>1){ let pgHtml=''; for(let i=1;i<=totalPages;i++) pgHtml+=`<button class="page-btn ${i===currentPage?'active':''}" onclick="goToPage(${i})">${i}</button>`; document.getElementById('pagination').innerHTML=pgHtml; }
    else document.getElementById('pagination').innerHTML='';
    document.getElementById('leadCount').innerText=allLeads.length;
  }

  window.goToPage=(page)=>{ currentPage=page; renderPage(); };

  window.loadLeads=async()=>{
    await loadTemplates();
    const snap=await getDocs(query(collection(db,"leads"), where("status","==","pending")));
    let leads=[];
    snap.forEach(d=>leads.push({id:d.id,...d.data()}));
    allLeads=leads.sort((a,b)=>{ 
      const aStatus = leadStatus[a.id] || 'unsent';
      const bStatus = leadStatus[b.id] || 'unsent';
      const order = { unsent: 0, sent: 1, reminder_sent: 2 };
      return (order[aStatus] || 0) - (order[bStatus] || 0);
    });
    currentPage=1; renderPage();
  };

  // Auto login check
  onAuthStateChanged(auth, (user) => {
    if(user) {
      console.log('Logged in:', user.uid);
    } else {
      console.log('Not logged in');
    }
  });

  loadLeads(); 
  setInterval(loadLeads, 15000);
</script>
</body>
</html>
