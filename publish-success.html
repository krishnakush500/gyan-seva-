<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🎉 Result Published</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: #e8ecf1; 
            min-height: 100vh; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .topbar {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            background: linear-gradient(135deg, #1a237e, #283593);
            color: white;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            border-radius: 8px;
            z-index: 100;
            max-width: 1200px;
            margin: 0 auto;
        }
        .topbar .brand { font-size: 0.95rem; font-weight: 700; }
        .topbar .brand i { color: #ffc107; }
        .topbar .back-btn {
            background: rgba(255,255,255,0.15);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 4px 12px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.3s;
            text-decoration: none;
        }
        .topbar .back-btn:hover { background: rgba(255,255,255,0.25); color: white; }
        
        .success-card {
            background: white;
            border-radius: 12px;
            padding: 35px 40px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 4px 16px rgba(26, 35, 126, 0.08);
            border: 1px solid #e2e8f0;
            margin-top: 70px;
            animation: fadeInUp 0.5s ease;
        }
        
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        .success-icon {
            width: 70px;
            height: 70px;
            background: #e8f5e9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        .success-icon i {
            font-size: 32px;
            color: #4caf50;
        }
        
        .exam-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a237e;
            text-align: center;
            margin-bottom: 4px;
        }
        .exam-name i {
            color: #ffc107;
            margin-right: 6px;
        }
        
        .subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: #4caf50;
            font-weight: 600;
            margin-bottom: 18px;
        }
        .subtitle i { margin-right: 4px; }
        
        .divider {
            height: 1px;
            background: #e2e8f0;
            margin: 16px 0;
        }
        
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin: 14px 0;
        }
        
        .detail-item {
            background: #f8faff;
            border-radius: 8px;
            padding: 10px 8px;
            text-align: center;
            border: 1px solid #eef2f7;
        }
        .detail-item .label {
            font-size: 0.6rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .detail-item .value {
            font-size: 1rem;
            font-weight: 700;
            color: #1a237e;
            margin-top: 2px;
        }
        .detail-item.highlight {
            background: #1a237e;
            border-color: #1a237e;
        }
        .detail-item.highlight .label { color: rgba(255,255,255,0.7); }
        .detail-item.highlight .value { color: white; }
        
        .subjects-box {
            background: #f8faff;
            border-radius: 8px;
            padding: 10px 14px;
            margin: 12px 0 16px;
            border: 1px solid #eef2f7;
        }
        .subjects-box .label {
            font-size: 0.6rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .subjects-box .subjects-text {
            font-size: 0.8rem;
            color: #334155;
            font-weight: 500;
            margin-top: 2px;
        }
        
        .publish-time {
            text-align: center;
            font-size: 0.7rem;
            color: #94a3b8;
            margin: 10px 0 16px;
        }
        
        .share-link-section {
            background: #f0f7ff;
            border-radius: 10px;
            padding: 14px 16px;
            margin: 14px 0 16px;
            border: 1.5px dashed #1a237e;
        }
        .share-link-section .label {
            font-size: 0.7rem;
            font-weight: 600;
            color: #1a237e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
        }
        .share-link-section .label i {
            font-size: 0.9rem;
            color: #ffc107;
        }
        .share-link-box {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .share-link-box input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #c8d0dc;
            border-radius: 6px;
            font-size: 0.75rem;
            background: white;
            color: #1a237e;
            min-width: 150px;
            font-weight: 500;
            outline: none;
        }
        .share-link-box input:focus {
            border-color: #1a237e;
            box-shadow: 0 0 0 2px rgba(26,35,126,0.1);
        }
        .share-link-box .copy-btn {
            padding: 8px 14px;
            background: #1a237e;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }
        .share-link-box .copy-btn:hover {
            background: #283593;
            transform: translateY(-1px);
        }
        .share-link-box .copy-btn.copied {
            background: #4caf50;
        }
        
        .share-buttons {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .share-buttons .share-btn {
            padding: 6px 14px;
            border: none;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: white;
            text-decoration: none;
        }
        .share-buttons .share-btn:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }
        .share-btn.whatsapp { background: #25D366; }
        .share-btn.telegram { background: #0088cc; }
        .share-btn.email { background: #ea4335; }
        
        .btn-group-custom {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn-custom {
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.8rem;
            border: none;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            cursor: pointer;
        }
        .btn-primary-custom {
            background: #1a237e;
            color: white;
        }
        .btn-primary-custom:hover {
            background: #283593;
            transform: translateY(-1px);
            color: white;
        }
        .btn-outline-custom {
            background: transparent;
            color: #1a237e;
            border: 1.5px solid #1a237e;
        }
        .btn-outline-custom:hover {
            background: #1a237e;
            color: white;
            transform: translateY(-1px);
        }
        .btn-success-custom {
            background: #4caf50;
            color: white;
        }
        .btn-success-custom:hover {
            background: #43a047;
            transform: translateY(-1px);
            color: white;
        }
        
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }
        .confetti {
            position: absolute;
            width: 6px;
            height: 6px;
            animation: confettiFall linear forwards;
        }
        @keyframes confettiFall {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }
        
        @media (max-width: 480px) {
            .success-card { padding: 24px 18px; margin-top: 60px; }
            .exam-name { font-size: 1.2rem; }
            .details-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
            .detail-item { padding: 8px 6px; }
            .detail-item .value { font-size: 0.85rem; }
            .btn-custom { font-size: 0.7rem; padding: 6px 14px; }
            .topbar .brand { font-size: 0.75rem; }
            .share-link-box input { font-size: 0.65rem; padding: 6px 10px; }
            .share-link-box .copy-btn { font-size: 0.65rem; padding: 6px 12px; }
            .share-buttons .share-btn { font-size: 0.6rem; padding: 4px 10px; }
        }
    </style>
</head>
<body>

<!-- ===== TOP BAR ===== -->
<div class="topbar">
    <div class="brand"><i class="fas fa-table"></i> GYAN SEVA</div>
    <div>
        <a href="manage-results.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back
        </a>
    </div>
</div>

<!-- ===== CONFETTI ===== -->
<div class="confetti-container" id="confettiContainer"></div>

<!-- ===== SUCCESS CARD ===== -->
<div class="success-card">
    <div class="success-icon">
        <i class="fas fa-check-circle"></i>
    </div>
    
    <div class="exam-name">
        <i class="fas fa-graduation-cap"></i> <span id="displayExamName">-</span>
    </div>
    
    <div class="subtitle">
        <i class="fas fa-check-circle"></i> Result Published Successfully!
    </div>
    
    <div class="divider"></div>
    
    <div class="details-grid">
        <div class="detail-item">
            <div class="label">Class</div>
            <div class="value" id="displayClass">-</div>
        </div>
        <div class="detail-item highlight">
            <div class="label">Students</div>
            <div class="value" id="displayStudents">0</div>
        </div>
        <div class="detail-item">
            <div class="label">Session</div>
            <div class="value" id="displaySession">-</div>
        </div>
    </div>
    
    <div class="subjects-box">
        <div class="label">Subjects</div>
        <div class="subjects-text" id="displaySubjects">-</div>
    </div>
    
    <!-- ===== SHARE LINK SECTION ===== -->
    <div class="share-link-section">
        <div class="label">
            <i class="fas fa-link"></i> Share Result Link with Students
        </div>
        <div class="share-link-box">
            <input type="text" id="shareLinkInput" readonly value="">
            <button class="copy-btn" id="copyLinkBtn" onclick="copyShareLink()">
                <i class="fas fa-copy"></i> Copy
            </button>
        </div>
        <div class="share-buttons">
            <button class="share-btn whatsapp" onclick="shareOnWhatsApp()">
                <i class="fab fa-whatsapp"></i> WhatsApp
            </button>
            <button class="share-btn telegram" onclick="shareOnTelegram()">
                <i class="fab fa-telegram-plane"></i> Telegram
            </button>
            <button class="share-btn email" onclick="shareOnEmail()">
                <i class="fas fa-envelope"></i> Email
            </button>
        </div>
        <div style="font-size:0.65rem; color:#94a3b8; margin-top:6px;">
            <i class="fas fa-info-circle"></i> Students can check their result by entering roll number
        </div>
    </div>
    
    <div class="publish-time">
        <i class="far fa-clock"></i> Published: <span id="displayPublishTime">-</span>
    </div>
    
    <div class="btn-group-custom">
        <a href="manage-results.html" class="btn-custom btn-primary-custom">
            <i class="fas fa-arrow-left"></i> Dashboard
        </a>
        <a href="entry-sheet.html" class="btn-custom btn-success-custom">
            <i class="fas fa-plus"></i> New Result
        </a>
        <a href="manage-results.html?showPublished=true" class="btn-custom btn-outline-custom">
            <i class="fas fa-eye"></i> View All
        </a>
    </div>
</div>

<script>
    // ===== LOAD DATA =====
    const successData = JSON.parse(localStorage.getItem('publishSuccessData') || '{}');
    const schoolId = localStorage.getItem('schoolId') || '';
    
    document.getElementById('displayExamName').textContent = successData.examName || 'Exam';
    document.getElementById('displayClass').textContent = successData.examClass || '-';
    document.getElementById('displayStudents').textContent = successData.totalStudents || 0;
    document.getElementById('displaySession').textContent = successData.examSession || '-';
    document.getElementById('displaySubjects').textContent = successData.subjects || '-';
    
    // ===== GENERATE SHAREABLE LINK =====
    function getShareableLink() {
        const baseUrl = window.location.origin + window.location.pathname.replace('publish-success.html', '');
        return `${baseUrl}dashboard.html?id=${schoolId}`;
    }
    
    const shareLinkInput = document.getElementById('shareLinkInput');
    shareLinkInput.value = getShareableLink();
    
    // ===== COPY LINK =====
    function copyShareLink() {
        const input = document.getElementById('shareLinkInput');
        input.select();
        input.setSelectionRange(0, 99999);
        
        try {
            document.execCommand('copy');
            const btn = document.getElementById('copyLinkBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.classList.remove('copied');
            }, 2000);
        } catch(err) {
            alert('Please copy the link manually: ' + input.value);
        }
    }
    
    // ===== 🔥 SHARE FUNCTIONS - ONLY TEXT (No Emojis) =====
    function getShareText() {
        const examName = successData.examName || 'Result';
        const className = successData.examClass || '';
        const link = getShareableLink();
        
        return `RESULT PUBLISHED\n\nExam: ${examName}\nClass: ${className}\n\nCheck your result here:\n${link}\n\nEnter your roll number to view your marks.`;
    }
    
    function shareOnWhatsApp() {
        const text = getShareText();
        const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
        window.open(url, '_blank');
    }
    
    function shareOnTelegram() {
        const text = getShareText();
        const url = `https://t.me/share/url?url=${encodeURIComponent(getShareableLink())}&text=${encodeURIComponent(text)}`;
        window.open(url, '_blank');
    }
    
    function shareOnEmail() {
        const subject = `${successData.examName || 'Result'} - Published`;
        const body = getShareText();
        const url = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        window.open(url, '_blank');
    }
    
    // ===== PUBLISH TIME =====
    const now = new Date();
    document.getElementById('displayPublishTime').textContent = now.toLocaleString('en-IN', {
        day: 'numeric',
        month: 'short',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        hour12: true
    });
    
    // ===== CONFETTI =====
    function createConfetti() {
        const container = document.getElementById('confettiContainer');
        const colors = ['#1a237e', '#4a6cf7', '#4caf50', '#ffc107', '#f44336'];
        for (let i = 0; i < 50; i++) {
            const c = document.createElement('div');
            c.className = 'confetti';
            c.style.left = Math.random() * 100 + '%';
            c.style.top = '-10px';
            c.style.background = colors[Math.floor(Math.random() * colors.length)];
            c.style.width = (Math.random() * 6 + 3) + 'px';
            c.style.height = (Math.random() * 6 + 3) + 'px';
            c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
            c.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
            c.style.animationDelay = (Math.random() * 1.2) + 's';
            container.appendChild(c);
        }
        setTimeout(() => container.innerHTML = '', 4000);
    }
    createConfetti();
    setTimeout(createConfetti, 1500);
</script>
</body>
</html>
