<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>GYAN SEVA — Connected Customers</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', system-ui, sans-serif; }
    body { background:#ffffff; min-height:100vh; padding:40px 24px; }
    .container { max-width:1200px; margin:0 auto; }
    .nav-links { text-align:center; margin-bottom:30px; }
    .nav-links a { text-decoration:none; background:#f1f5f9; padding:8px 24px; border-radius:40px; margin:0 8px; color:#1e293b; font-weight:500; font-size:0.85rem; }
    .connected-card { background:#ffffff; border-radius:48px; box-shadow:0 20px 40px -12px rgba(0,0,0,0.08); border:1px solid #dbeafe; overflow:hidden; }
    .connected-header { background:#2563eb; padding:28px 32px; text-align:center; }
    .connected-header h2 { color:white; font-size:2rem; font-weight:700; display:flex; align-items:center; justify-content:center; gap:12px; }
    .connected-header p { color:#dbeafe; margin-top:8px; font-size:0.9rem; }
    .connected-body { padding:32px; }
    .stats-bar { background:#eef2ff; border-radius:24px; padding:16px 20px; margin-bottom:28px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
    .stat-count { background:#2563eb; color:white; padding:6px 16px; border-radius:40px; font-weight:600; }
    .refresh-btn { background:#f1f5f9; border:none; padding:8px 20px; border-radius:40px; cursor:pointer; font-weight:500; }
    .coachings-container { max-height:550px; overflow-y:auto; }
    .coaching-card { background:#f8fafc; border-radius:24px; padding:20px; margin-bottom:16px; border:1px solid #e2e8f0; transition:0.2s; }
    .coaching-card:hover { border-color:#2563eb; box-shadow:0 4px 12px rgba(37,99,235,0.1); }
    .coaching-header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:12px; }
    .coaching-name { font-size:1.2rem; font-weight:700; color:#1e293b; }
    .status-badge { background:#dbeafe; color:#2563eb; padding:4px 12px; border-radius:30px; font-size:0.7rem; font-weight:600; }
    .coaching-details { display:flex; flex-wrap:wrap; gap:16px; margin-bottom:16px; font-size:0.85rem; color:#475569; }
    .coaching-details i { width:20px; color:#2563eb; }
    .action-buttons { display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; }
    .btn-dashboard { background:#2563eb; color:white; padding:8px 18px; border-radius:40px; text-decoration:none; font-size:0.75rem; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
    .btn-results { background:#8b5cf6; color:white; padding:8px 18px; border-radius:40px; font-size:0.75rem; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; border:none; }
    .btn-create-result { background:#10b981; color:white; padding:8px 18px; border-radius:40px; text-decoration:none; font-size:0.75rem; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
    .btn-edit { background:#f59e0b; color:white; padding:8px 18px; border-radius:40px; border:none; font-size:0.75rem; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
    .btn-delete { background:#dc2626; color:white; padding:8px 18px; border-radius:40px; border:none; font-size:0.75rem; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
    .btn-whatsapp { background:#25D366; color:white; padding:8px 18px; border-radius:40px; text-decoration:none; font-size:0.75rem; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
    .empty-state { text-align:center; padding:50px 20px; color:#94a3b8; }
    .add-new { margin-top:24px; text-align:center; }
    .add-new a { background:#1e293b; color:white; padding:10px 28px; border-radius:40px; text-decoration:none; font-weight:600; }
    
    /* Modal Styles */
    .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center; }
    .modal-content { background:white; border-radius:32px; padding:28px; max-width:550px; width:90%; max-height:85vh; overflow-y:auto; }
    .modal-content h3 { margin-bottom:10px; color:#1e293b; display:flex; align-items:center; gap:10px; }
    .modal-content p.subtitle { color:#64748b; margin-bottom:20px; font-size:0.85rem; }
    .results-list-modal { max-height:300px; overflow-y:auto; }
    .result-item-modal { display:flex; justify-content:space-between; align-items:center; padding:12px; border-bottom:1px solid #e2e8f0; }
    .result-item-modal .result-name { font-weight:600; color:#1e293b; }
    .result-item-modal .result-date { font-size:0.7rem; color:#64748b; }
    .result-actions { display:flex; gap:8px; }
    .result-actions button { padding:4px 12px; border-radius:20px; border:none; font-size:0.7rem; cursor:pointer; }
    .btn-edit-result { background:#f59e0b; color:white; }
    .btn-delete-result { background:#dc2626; color:white; }
    .modal-buttons { display:flex; gap:12px; margin-top:20px; justify-content:flex-end; }
    .modal-buttons button { padding:10px 20px; border-radius:40px; border:none; cursor:pointer; font-weight:600; }
    .btn-close-modal { background:#94a3b8; color:white; }
    footer { text-align:center; margin-top:40px; color:#94a3b8; font-size:0.75rem; }
    @media (max-width:640px){ .coaching-details{ flex-direction:column; gap:8px; } .action-buttons{ flex-direction:column; } .btn-dashboard, .btn-results, .btn-create-result, .btn-edit, .btn-delete, .btn-whatsapp{ text-align:center; justify-content:center; } }
  </style>
</head>
<body>

<div class="container">
  <div class="nav-links">
    <a href="index.html"><i class="fas fa-home"></i> Home</a>
    <a href="save-customer.html"><i class="fas fa-save"></i> Save Customer</a>
    <a href="connect.html"><i class="fab fa-whatsapp"></i> Connect to Customer</a>
  </div>

  <div class="connected-card">
    <div class="connected-header">
      <h2><i class="fas fa-handshake"></i> CONNECTED CUSTOMER</h2>
      <p>Active coachings that have joined GYAN SEVA</p>
    </div>
    <div class="connected-body">
      <div class="stats-bar">
        <span><i class="fas fa-users"></i> <strong>Active Coachings</strong></span>
        <span class="stat-count" id="coachingCount">0</span>
        <button class="refresh-btn" onclick="loadConnectedCoachings()"><i class="fas fa-sync-alt"></i> Refresh</button>
      </div>

      <div id="coachingsList" class="coachings-container">
        <div class="empty-state"><i class="fas fa-spinner fa-pulse"></i> Loading...</div>
      </div>

      <div class="add-new">
        <a href="admin.html"><i class="fas fa-plus-circle"></i> Add New Coaching</a>
      </div>
    </div>
  </div>
  <footer><i class="fas fa-heart" style="color:#2563eb;"></i> GYAN SEVA — Connected, Served, Growing</footer>
</div>

<!-- Results Modal -->
<div id="resultsModal" class="modal">
  <div class="modal-content">
    <h3><i class="fas fa-file-alt" style="color:#8b5cf6;"></i> All Results</h3>
    <p class="subtitle" id="modalCoachingName">Coaching Name</p>
    <div id="resultsListModal" class="results-list-modal">
      <p>Loading results...</p>
    </div>
    <div class="modal-buttons">
      <button class="btn-close-modal" onclick="closeResultsModal()">Close</button>
    </div>
  </div>
</div>

<!-- Edit Result Modal -->
<div id="editResultModal" class="modal">
  <div class="modal-content">
    <h3><i class="fas fa-edit"></i> Edit Result</h3>
    <label>Exam Name</label>
    <input type="text" id="editExamName" style="width:100%; padding:10px; margin:8px 0; border:1px solid #ddd; border-radius:12px;">
    <label>Exam Date</label>
    <input type="date" id="editExamDate" style="width:100%; padding:10px; margin:8px 0; border:1px solid #ddd; border-radius:12px;">
    <div class="modal-buttons">
      <button class="btn-close-modal" onclick="closeEditResultModal()">Cancel</button>
      <button class="btn-edit-result" onclick="saveResultEdit()" style="background:#10b981; color:white;">Save Changes</button>
    </div>
  </div>
</div>

<script type="module">
  import { db } from './firebase-config.js';
  import { collection, getDocs, query, where, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  let currentEditId = null;
  let currentEditCoachingId = null;
  let currentEditResultId = null;

  window.openCreateResult = (coachingId) => {
    window.open(`create-result.html?id=${coachingId}`, '_blank');
  };

  // Show all results for a coaching
  window.showResults = async (coachingId, coachingName) => {
    document.getElementById('modalCoachingName').innerHTML = `<i class="fas fa-school"></i> ${coachingName}`;
    document.getElementById('resultsModal').style.display = 'flex';
    currentEditCoachingId = coachingId;
    
    const resultsRef = collection(db, "results");
    const q = query(resultsRef, where("coachingId", "==", coachingId));
    const snapshot = await getDocs(q);
    const container = document.getElementById('resultsListModal');
    
    if(snapshot.empty) {
      container.innerHTML = '<p style="text-align:center; padding:20px;">No results published yet.</p>';
      return;
    }
    
    let html = '';
    for(const docSnap of snapshot.docs) {
      const result = docSnap.data();
      html += `
        <div class="result-item-modal">
          <div>
            <div class="result-name">📘 ${result.examName}</div>
            <div class="result-date">📅 ${result.examDate || 'Date not set'} | Subjects: ${result.subjects?.length || 0}</div>
          </div>
          <div class="result-actions">
            <button class="btn-edit-result" onclick="openEditResult('${docSnap.id}', '${result.examName.replace(/'/g, "\\'")}', '${result.examDate || ''}')"><i class="fas fa-pen"></i> Edit</button>
            <button class="btn-delete-result" onclick="deleteResult('${docSnap.id}')"><i class="fas fa-trash"></i> Delete</button>
          </div>
        </div>
      `;
    }
    container.innerHTML = html;
  };
  
  window.closeResultsModal = () => {
    document.getElementById('resultsModal').style.display = 'none';
  };
  
  // Open edit result modal
  window.openEditResult = (resultId, examName, examDate) => {
    currentEditResultId = resultId;
    document.getElementById('editExamName').value = examName;
    document.getElementById('editExamDate').value = examDate;
    document.getElementById('editResultModal').style.display = 'flex';
    closeResultsModal();
  };
  
  window.closeEditResultModal = () => {
    document.getElementById('editResultModal').style.display = 'none';
    currentEditResultId = null;
  };
  
  window.saveResultEdit = async () => {
    if(!currentEditResultId) return;
    const resultRef = doc(db, "results", currentEditResultId);
    await updateDoc(resultRef, {
      examName: document.getElementById('editExamName').value,
      examDate: document.getElementById('editExamDate').value
    });
    closeEditResultModal();
    if(currentEditCoachingId) {
      const coaching = await getDocs(query(collection(db, "coachings")));
      let coachingName = '';
      for(const c of coaching.docs) {
        if(c.id === currentEditCoachingId) coachingName = c.data().name;
      }
      showResults(currentEditCoachingId, coachingName);
    }
    loadConnectedCoachings();
    alert("✅ Result updated!");
  };
  
  // Delete single result
  window.deleteResult = async (resultId) => {
    if(confirm("Delete this result permanently?")) {
      // Delete marks subcollection first
      const marksRef = collection(db, "results", resultId, "marks");
      const marksSnap = await getDocs(marksRef);
      for(const markDoc of marksSnap.docs) {
        await deleteDoc(doc(db, "results", resultId, "marks", markDoc.id));
      }
      await deleteDoc(doc(db, "results", resultId));
      alert("✅ Result deleted!");
      if(currentEditCoachingId) {
        const coaching = await getDocs(query(collection(db, "coachings")));
        let coachingName = '';
        for(const c of coaching.docs) {
          if(c.id === currentEditCoachingId) coachingName = c.data().name;
        }
        showResults(currentEditCoachingId, coachingName);
      }
      loadConnectedCoachings();
    }
  };
  
  // Delete entire coaching
  window.deleteCoaching = async (coachingId, coachingName) => {
    if(confirm(`⚠️ Are you sure you want to delete "${coachingName}"?\n\nThis will also delete ALL results and student data for this coaching. This action cannot be undone!`)) {
      // Delete all results and their marks
      const resultsRef = collection(db, "results");
      const q = query(resultsRef, where("coachingId", "==", coachingId));
      const resultsSnap = await getDocs(q);
      for(const resultDoc of resultsSnap.docs) {
        // Delete marks subcollection
        const marksRef = collection(db, "results", resultDoc.id, "marks");
        const marksSnap = await getDocs(marksRef);
        for(const markDoc of marksSnap.docs) {
          await deleteDoc(doc(db, "results", resultDoc.id, "marks", markDoc.id));
        }
        await deleteDoc(doc(db, "results", resultDoc.id));
      }
      // Delete coaching
      await deleteDoc(doc(db, "coachings", coachingId));
      alert(`✅ "${coachingName}" has been deleted successfully!`);
      loadConnectedCoachings();
    }
  };

  window.loadConnectedCoachings = async function() {
    try {
      const coachingsRef = collection(db, "coachings");
      const snapshot = await getDocs(coachingsRef);
      const container = document.getElementById('coachingsList');
      document.getElementById('coachingCount').innerText = snapshot.size;
      if(snapshot.empty) { container.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><br>No connected coachings yet.</div>'; return; }
      let html = '';
      for(const docSnap of snapshot.docs) {
        const c = docSnap.data();
        const id = docSnap.id;
        const resultsQuery = query(collection(db, "results"), where("coachingId", "==", id));
        const resultsSnap = await getDocs(resultsQuery);
        const logoHtml = c.logo ? `<img src="${c.logo}" style="width:32px; height:32px; border-radius:50%; object-fit:cover; margin-right:6px; vertical-align:middle;" onerror="this.style.display='none'">` : '';
        html += `
          <div class="coaching-card">
            <div class="coaching-header">
              <div class="coaching-name">${logoHtml} 🎓 ${c.name}</div>
              <span class="status-badge"><i class="fas fa-check-circle"></i> Active</span>
            </div>
            <div class="coaching-details">
              <div><i class="fas fa-user-tie"></i> ${c.director || 'Director not set'}</div>
              <div><i class="fas fa-phone"></i> ${c.phone}</div>
              <div><i class="fas fa-location-dot"></i> ${c.location || 'Location not set'}</div>
              <div><i class="fas fa-chart-line"></i> ${resultsSnap.size} Results</div>
            </div>
            <div class="action-buttons">
              <a href="dashboard.html?id=${id}" class="btn-dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
              <button class="btn-results" onclick="showResults('${id}', '${c.name.replace(/'/g, "\\'")}')"><i class="fas fa-list"></i> Results</button>
              <button class="btn-create-result" onclick="openCreateResult('${id}')"><i class="fas fa-plus-circle"></i> Create Result</button>
              <button class="btn-edit" onclick="openEditModal('${id}', '${c.name.replace(/'/g, "\\'")}', '${(c.director || '').replace(/'/g, "\\'")}', '${c.phone}', '${(c.location || '').replace(/'/g, "\\'")}', '${(c.logo || '').replace(/'/g, "\\'")}')"><i class="fas fa-pen"></i> Edit</button>
              <button class="btn-delete" onclick="deleteCoaching('${id}', '${c.name.replace(/'/g, "\\'")}')"><i class="fas fa-trash-alt"></i> Delete</button>
              <a href="https://wa.me/91${c.phone}?text=Namaste%20${c.name}%20team,%0AThis%20is%20GYAN%20SEVA.%20Dashboard%20is%20ready!" target="_blank" class="btn-whatsapp"><i class="fab fa-whatsapp"></i> WhatsApp</a>
            </div>
          </div>
        `;
      }
      container.innerHTML = html;
    } catch(e) { console.error(e); }
  };

  // Edit Modal Functions (existing)
  window.openEditModal = (id, name, director, phone, location, logo) => {
    currentEditId = id;
    document.getElementById('editName').value = name;
    document.getElementById('editDirector').value = director;
    document.getElementById('editPhone').value = phone;
    document.getElementById('editLocation').value = location;
    document.getElementById('editLogo').value = logo;
    document.getElementById('editModal').style.display = 'flex';
  };
  
  window.closeEditModal = () => { 
    document.getElementById('editModal').style.display = 'none'; 
    currentEditId = null; 
  };
  
  window.saveCoachingEdit = async () => {
    if(!currentEditId) return;
    const coachingRef = doc(db, "coachings", currentEditId);
    await updateDoc(coachingRef, {
      name: document.getElementById('editName').value,
      director: document.getElementById('editDirector').value,
      phone: document.getElementById('editPhone').value,
      location: document.getElementById('editLocation').value,
      logo: document.getElementById('editLogo').value
    });
    closeEditModal();
    loadConnectedCoachings();
    alert("✅ Coaching details updated!");
  };
  
  window.loadConnectedCoachings();
  setInterval(loadConnectedCoachings, 20000);
</script>

<!-- Edit Modal (Coaching Edit) -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <h3><i class="fas fa-edit"></i> Edit Coaching Details</h3>
    <input type="text" id="editName" placeholder="Coaching Name" style="width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:12px;">
    <input type="text" id="editDirector" placeholder="Director Name" style="width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:12px;">
    <input type="text" id="editPhone" placeholder="Phone Number" style="width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:12px;">
    <input type="text" id="editLocation" placeholder="Location" style="width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:12px;">
    <textarea id="editLogo" rows="2" placeholder="Logo Image URL (direct link)" style="width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:12px;"></textarea>
    <div class="modal-buttons">
      <button class="btn-close-modal" onclick="closeEditModal()">Cancel</button>
      <button class="btn-edit-result" onclick="saveCoachingEdit()" style="background:#10b981; color:white;">Save Changes</button>
    </div>
  </div>
</div>
</body>
</html>
