<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>GYAN SEVA — Connected Customers</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', system-ui, sans-serif; }
    body { background:#ffffff; min-height:100vh; padding:40px 24px; }
    .container { max-width:1200px; margin:0 auto; }
    .nav-links { text-align:center; margin-bottom:30px; }
    .nav-links a { text-decoration:none; background:#f1f5f9; padding:8px 24px; border-radius:40px; margin:0 8px; color:#1e293b; font-weight:500; font-size:0.85rem; }
    .connected-card { background:#ffffff; border-radius:48px; box-shadow:0 20px 40px -12px rgba(0,0,0,0.08); border:1px solid #dbeafe; overflow:hidden; }
    .connected-header { background:#2563eb; padding:28px 32px; text-align:center; }
    .connected-header h2 { color:white; font-size:2rem; font-weight:700; display:flex; align-items:center; justify-content:center; gap:12px; }
    .connected-header p { color:#dbeafe; margin-top:8px; font-size:0.9rem; }
    .connected-body { padding:32px; }
    .stats-bar { background:#eef2ff; border-radius:24px; padding:16px 20px; margin-bottom:28px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
    .stat-count { background:#2563eb; color:white; padding:6px 16px; border-radius:40px; font-weight:600; }
    .refresh-btn { background:#f1f5f9; border:none; padding:8px 20px; border-radius:40px; cursor:pointer; font-weight:500; }
    .coachings-container { max-height:550px; overflow-y:auto; }
    .coaching-card { background:#f8fafc; border-radius:24px; padding:20px; margin-bottom:16px; border:1px solid #e2e8f0; transition:0.2s; }
    .coaching-card:hover { border-color:#2563eb; box-shadow:0 4px 12px rgba(37,99,235,0.1); }
    .coaching-header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:12px; }
    .coaching-name { font-size:1.2rem; font-weight:700; color:#1e293b; }
    .status-badge { background:#dbeafe; color:#2563eb; padding:4px 12px; border-radius:30px; font-size:0.7rem; font-weight:600; }
    .coaching-details { display:flex; flex-wrap:wrap; gap:16px; margin-bottom:16px; font-size:0.85rem; color:#475569; }
    .coaching-details i { width:20px; color:#2563eb; }
    .action-buttons { display:flex; flex-wrap:wrap; gap:12px; margin-top:8px; }
    .btn-dashboard { background:#2563eb; color:white; padding:8px 20px; border-radius:40px; text-decoration:none; font-size:0.8rem; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
    .btn-edit { background:#f59e0b; color:white; padding:8px 20px; border-radius:40px; border:none; font-size:0.8rem; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
    .btn-whatsapp { background:#25D366; color:white; padding:8px 20px; border-radius:40px; text-decoration:none; font-size:0.8rem; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
    .empty-state { text-align:center; padding:50px 20px; color:#94a3b8; }
    .add-new { margin-top:24px; text-align:center; }
    .add-new a { background:#1e293b; color:white; padding:10px 28px; border-radius:40px; text-decoration:none; font-weight:600; }
    footer { text-align:center; margin-top:40px; color:#94a3b8; font-size:0.75rem; }

    /* Modal Styles */
    .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center; }
    .modal-content { background:white; border-radius:32px; padding:30px; max-width:500px; width:90%; max-height:90vh; overflow-y:auto; }
    .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:2px solid #eef2ff; padding-bottom:15px; }
    .modal-header h3 { color:#1e293b; font-size:1.5rem; }
    .close-modal { background:none; border:none; font-size:1.5rem; cursor:pointer; color:#94a3b8; }
    .form-group { margin-bottom:15px; }
    .form-group label { display:block; font-weight:600; margin-bottom:5px; color:#1e293b; }
    .form-group input, .form-group textarea { width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:12px; font-size:0.9rem; }
    .form-group input:focus { outline:none; border-color:#2563eb; }
    .btn-save { background:#2563eb; color:white; padding:12px; border:none; border-radius:40px; font-weight:600; cursor:pointer; width:100%; }
    .toast { position:fixed; bottom:30px; right:30px; background:#1e293b; color:white; padding:12px 24px; border-radius:50px; font-size:0.85rem; z-index:1001; animation:fadeInOut 3s ease; }
    @keyframes fadeInOut { 0% { opacity:0; transform:translateY(20px); } 15% { opacity:1; transform:translateY(0); } 85% { opacity:1; } 100% { opacity:0; transform:translateY(20px); } }
  </style>
</head>
<body>

<div class="container">
  <div class="nav-links">
    <a href="index.html"><i class="fas fa-home"></i> Home</a>
    <a href="save-customer.html"><i class="fas fa-save"></i> Save Customer</a>
    <a href="connect.html"><i class="fab fa-whatsapp"></i> Connect to Customer</a>
  </div>

  <div class="connected-card">
    <div class="connected-header">
      <h2><i class="fas fa-handshake"></i> CONNECTED CUSTOMER</h2>
      <p>Active coachings that have joined GYAN SEVA</p>
    </div>
    <div class="connected-body">
      <div class="stats-bar">
        <span><i class="fas fa-users"></i> <strong>Active Coachings</strong></span>
        <span class="stat-count" id="coachingCount">0</span>
        <button class="refresh-btn" onclick="loadConnectedCoachings()"><i class="fas fa-sync-alt"></i> Refresh</button>
      </div>

      <div id="coachingsList" class="coachings-container">
        <div class="empty-state"><i class="fas fa-spinner fa-pulse"></i> Loading connected coachings...</div>
      </div>

      <div class="add-new">
        <a href="admin.html"><i class="fas fa-plus-circle"></i> Add New Coaching</a>
      </div>
    </div>
  </div>

  <footer><i class="fas fa-heart" style="color:#2563eb;"></i> GYAN SEVA — Connected, Served, Growing</footer>
</div>

<!-- Edit Modal -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3><i class="fas fa-edit"></i> Edit Coaching Details</h3>
      <button class="close-modal" onclick="closeEditModal()">&times;</button>
    </div>
    <div class="form-group">
      <label>Coaching Name</label>
      <input type="text" id="editName" placeholder="e.g., Raman Science Classes">
    </div>
    <div class="form-group">
      <label>Director Name</label>
      <input type="text" id="editDirector" placeholder="e.g., Raman Sir">
    </div>
    <div class="form-group">
      <label>Phone Number</label>
      <input type="text" id="editPhone" placeholder="e.g., 9123456789">
    </div>
    <div class="form-group">
      <label>Location / Address</label>
      <input type="text" id="editLocation" placeholder="e.g., Begusarai, Bihar">
    </div>
    <div class="form-group">
      <label>Logo URL (optional)</label>
      <input type="text" id="editLogo" placeholder="https://example.com/logo.png">
    </div>
    <button class="btn-save" id="saveEditBtn"><i class="fas fa-save"></i> Save Changes</button>
  </div>
</div>

<script type="module">
  import { db } from './firebase-config.js';
  import { collection, getDocs, query, where, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  let currentEditId = null;

  function showToast(message, isError = false) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.style.background = isError ? '#dc2626' : '#10b981';
    toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i> ${message}`;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  window.openEditModal = (id, name, director, phone, location, logo) => {
    currentEditId = id;
    document.getElementById('editName').value = name || '';
    document.getElementById('editDirector').value = director || '';
    document.getElementById('editPhone').value = phone || '';
    document.getElementById('editLocation').value = location || '';
    document.getElementById('editLogo').value = logo || '';
    document.getElementById('editModal').style.display = 'flex';
  };

  window.closeEditModal = () => {
    document.getElementById('editModal').style.display = 'none';
    currentEditId = null;
  };

  window.saveEdit = async function() {
    if (!currentEditId) return;
    
    const updatedData = {
      name: document.getElementById('editName').value,
      director: document.getElementById('editDirector').value,
      phone: document.getElementById('editPhone').value,
      location: document.getElementById('editLocation').value,
      logo: document.getElementById('editLogo').value,
      updatedAt: new Date().toISOString()
    };
    
    if (!updatedData.name) {
      showToast("Coaching name is required!", true);
      return;
    }
    
    try {
      const coachingRef = doc(db, "coachings", currentEditId);
      await updateDoc(coachingRef, updatedData);
      showToast(`✅ ${updatedData.name} details updated!`);
      closeEditModal();
      loadConnectedCoachings();
    } catch (error) {
      console.error("Error updating:", error);
      showToast("❌ Failed to update", true);
    }
  };

  document.getElementById('saveEditBtn').onclick = () => saveEdit();

  window.loadConnectedCoachings = async function() {
    try {
      const coachingsRef = collection(db, "coachings");
      const snapshot = await getDocs(coachingsRef);
      
      const container = document.getElementById('coachingsList');
      const countSpan = document.getElementById('coachingCount');
      
      if (snapshot.empty) {
        container.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><br>No connected coachings yet.<br>Click "Make Dashboard" in Connect to Customer page.<br><br>👇 Or click below to add manually.</div>`;
        countSpan.innerText = '0';
        return;
      }
      
      countSpan.innerText = snapshot.size;
      
      let html = '';
      for (const docSnap of snapshot.docs) {
        const coaching = docSnap.data();
        const id = docSnap.id;
        
        const resultsRef = collection(db, "results");
        const resultsQuery = query(resultsRef, where("coachingId", "==", id));
        const resultsSnap = await getDocs(resultsQuery);
        const resultCount = resultsSnap.size;
        
        const whatsappMessage = `Namaste ${coaching.name} team,%0A%0AThis is GYAN SEVA. Your result portal is ready!%0A%0A📊 Total results published: ${resultCount}%0A📈 Students can check marks online.%0A%0ADashboard: https://gyanseva.web.app/dashboard.html?id=${id}%0A%0AKeep growing! 🙏%0A%0A-GYAN SEVA Team`;
        const waLink = `https://wa.me/91${coaching.phone}?text=${whatsappMessage}`;
        
        html += `
          <div class="coaching-card">
            <div class="coaching-header">
              <div class="coaching-name">🎓 ${coaching.name}</div>
              <span class="status-badge"><i class="fas fa-check-circle"></i> Active</span>
            </div>
            <div class="coaching-details">
              <div><i class="fas fa-user-tie"></i> ${coaching.director || 'Director not set'}</div>
              <div><i class="fas fa-phone"></i> ${coaching.phone}</div>
              <div><i class="fas fa-location-dot"></i> ${coaching.location || 'Location not set'}</div>
              <div><i class="fas fa-chart-line"></i> ${resultCount} Results</div>
            </div>
            <div class="action-buttons">
              <a href="dashboard.html?id=${id}" class="btn-dashboard">
                <i class="fas fa-tachometer-alt"></i> Open Dashboard
              </a>
              <button class="btn-edit" onclick="openEditModal('${id}', '${coaching.name.replace(/'/g, "\\'")}', '${coaching.director || ''}', '${coaching.phone || ''}', '${coaching.location || ''}', '${coaching.logo || ''}')">
                <i class="fas fa-edit"></i> Edit
              </button>
              <a href="${waLink}" target="_blank" class="btn-whatsapp">
                <i class="fab fa-whatsapp"></i> WhatsApp
              </a>
            </div>
          </div>
        `;
      }
      container.innerHTML = html;
      
    } catch (error) {
      console.error("Error:", error);
      document.getElementById('coachingsList').innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><br>Error loading coachings</div>`;
    }
  };

  window.loadConnectedCoachings();
  setInterval(loadConnectedCoachings, 15000);
</script>
</body>
</html>
