<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>GYAN SEVA — Connected Customers</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
    body { background:#ffffff; padding:40px 24px; }
    .container { max-width:1200px; margin:0 auto; }
    .nav-links { text-align:center; margin-bottom:30px; }
    .nav-links a { text-decoration:none; background:#f1f5f9; padding:8px 24px; border-radius:40px; margin:0 8px; color:#1e293b; font-weight:500; font-size:0.85rem; }
    .nav-links a.active { background:#2563eb; color:white; }
    .nav-links a i { margin-right:6px; }
    .connected-card { background:#fff; border-radius:48px; box-shadow:0 20px 40px -12px rgba(0,0,0,0.08); border:1px solid #dbeafe; overflow:hidden; }
    .connected-header { background:#2563eb; padding:28px 32px; text-align:center; }
    .connected-header h2 { color:white; font-size:2rem; font-weight:700; display:flex; align-items:center; justify-content:center; gap:12px; }
    .connected-header p { color:rgba(255,255,255,0.8); margin-top:5px; }
    .connected-body { padding:32px; }
    .stats-bar { background:#eef2ff; border-radius:24px; padding:16px 20px; margin-bottom:28px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
    .stat-count { background:#2563eb; color:white; padding:6px 16px; border-radius:40px; font-weight:600; }
    .refresh-btn { background:#f1f5f9; border:none; padding:8px 20px; border-radius:40px; cursor:pointer; font-weight:500; }
    .refresh-btn:hover { background:#e2e8f0; }
    .coachings-container { max-height:550px; overflow-y:auto; }
    .coaching-card { background:#f8fafc; border-radius:24px; padding:20px; margin-bottom:16px; border:1px solid #e2e8f0; transition:0.3s; }
    .coaching-card:hover { border-color:#2563eb; box-shadow:0 4px 12px rgba(37,99,235,0.08); }
    .coaching-header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:12px; }
    .coaching-name { font-size:1.2rem; font-weight:700; color:#1e293b; display:flex; align-items:center; gap:8px; }
    .coaching-name img { width:32px; height:32px; border-radius:50%; object-fit:cover; }
    .status-badge { background:#dbeafe; color:#2563eb; padding:4px 12px; border-radius:30px; font-size:0.7rem; font-weight:600; }
    .coaching-details { display:flex; flex-wrap:wrap; gap:16px; margin-bottom:16px; font-size:0.85rem; color:#475569; }
    .coaching-details i { width:20px; color:#2563eb; }
    .action-buttons { display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; }
    .btn-dashboard { background:#2563eb; color:white; padding:8px 18px; border-radius:40px; text-decoration:none; font-size:0.75rem; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
    .btn-dashboard:hover { background:#1d4ed8; color:white; }
    .btn-admin { background:#dc2626; color:white; padding:8px 18px; border-radius:40px; text-decoration:none; font-size:0.75rem; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
    .btn-admin:hover { background:#b91c1c; color:white; }
    .btn-whatsapp { background:#25D366; color:white; padding:8px 18px; border-radius:40px; text-decoration:none; font-size:0.75rem; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
    .btn-whatsapp:hover { background:#1da851; color:white; }
    .btn-edit { background:#f59e0b; color:white; padding:8px 18px; border-radius:40px; border:none; font-size:0.75rem; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
    .btn-edit:hover { background:#d97706; }
    .btn-delete { background:#dc2626; color:white; padding:8px 18px; border-radius:40px; border:none; font-size:0.75rem; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
    .btn-delete:hover { background:#b91c1c; }
    .empty-state { text-align:center; padding:50px 20px; color:#94a3b8; }
    .empty-state i { font-size:3rem; margin-bottom:15px; display:block; }
    footer { text-align:center; margin-top:40px; color:#94a3b8; font-size:0.75rem; }
    .demo-badge { background:#10b981; color:white; padding:2px 10px; border-radius:30px; font-size:0.6rem; margin-left:8px; }
    .whatsapp-link-sent { background:#d1fae5; color:#065f46; padding:2px 10px; border-radius:30px; font-size:0.6rem; margin-left:8px; }
    @media (max-width:640px){ .coaching-details{ flex-direction:column; gap:8px; } .action-buttons{ flex-direction:column; } .btn-dashboard,.btn-admin,.btn-edit,.btn-delete,.btn-whatsapp{ text-align:center; justify-content:center; } }
  </style>
</head>
<body>

<div class="container">
  <div class="nav-links">
    <a href="index.html"><i class="fas fa-home"></i> Home</a>
    <a href="connected.html" class="active"><i class="fas fa-handshake"></i> Connected</a>
    <a href="add-customer.html"><i class="fas fa-plus-circle"></i> Add Customer</a>
    <a href="teacher-panel.html"><i class="fas fa-chalkboard-user"></i> Teacher Panel</a>
  </div>

  <div class="connected-card">
    <div class="connected-header">
      <h2><i class="fas fa-handshake"></i> CONNECTED CUSTOMERS</h2>
      <p>All active coachings and schools in GYAN SEVA network</p>
    </div>
    <div class="connected-body">
      <div class="stats-bar">
        <span><i class="fas fa-users"></i> <strong>Total Coachings</strong></span>
        <span class="stat-count" id="coachingCount">0</span>
        <button class="refresh-btn" onclick="loadConnectedCoachings()"><i class="fas fa-sync-alt"></i> Refresh</button>
      </div>

      <div id="coachingsList" class="coachings-container">
        <div class="empty-state"><i class="fas fa-spinner fa-pulse"></i> Loading...</div>
      </div>
    </div>
  </div>
  <footer><i class="fas fa-heart" style="color:#2563eb;"></i> GYAN SEVA — Connected, Served, Growing</footer>
</div>

<!-- Edit Modal -->
<div id="editModal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1000; justify-content:center; align-items:center;">
  <div class="modal-content" style="background:white; border-radius:32px; padding:28px; max-width:500px; width:90%;">
    <h3 style="color:#1e293b; margin-bottom:15px;"><i class="fas fa-edit" style="color:#f59e0b;"></i> Edit Coaching</h3>
    <input type="text" id="editName" placeholder="Coaching Name" style="width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:12px;">
    <input type="text" id="editDirector" placeholder="Director" style="width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:12px;">
    <input type="text" id="editPhone" placeholder="Phone" style="width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:12px;">
    <input type="text" id="editLocation" placeholder="Location" style="width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:12px;">
    <input type="text" id="editLogo" placeholder="Logo URL" style="width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:12px;">
    <div style="display:flex; gap:12px; margin-top:20px; justify-content:flex-end;">
      <button onclick="closeEditModal()" style="padding:10px 20px; border-radius:40px; border:none; cursor:pointer; font-weight:600; background:#94a3b8; color:white;">Cancel</button>
      <button onclick="saveCoachingEdit()" style="padding:10px 20px; border-radius:40px; border:none; cursor:pointer; font-weight:600; background:#10b981; color:white;">Save</button>
    </div>
  </div>
</div>

<script type="module">
  import { db, auth } from './firebase-config.js';
  import { collection, getDocs, deleteDoc, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  let currentEditId = null;

  // ===== WHATSAPP SHARE FUNCTION =====
  window.shareOnWhatsApp = function(phone, name, coachingId) {
    // Create dashboard link
    const dashboardLink = `${window.location.origin}/teacher-panel.html?coachingId=${coachingId}`;
    
    // Create message
    const message = `📚 *Namaste ${name} Team!*

🎯 Your GYAN SEVA Admin Panel is ready!

🔗 *Dashboard Link:* ${dashboardLink}

📊 You can:
✅ Manage Results (Create, Edit, Publish)
✅ Conduct Online Tests
✅ View Student Performance

For any help, contact GYAN SEVA Support.

*GYAN SEVA* — Connected, Served, Growing 📈`;

    // WhatsApp URL
    const whatsappUrl = `https://wa.me/91${phone}?text=${encodeURIComponent(message)}`;
    
    // Open WhatsApp
    window.open(whatsappUrl, '_blank');
  };

  // ===== EDIT FUNCTIONS =====
  window.openEditModal = (id, name, dir, phone, loc, logo) => {
    currentEditId = id;
    document.getElementById('editName').value = name || '';
    document.getElementById('editDirector').value = dir || '';
    document.getElementById('editPhone').value = phone || '';
    document.getElementById('editLocation').value = loc || '';
    document.getElementById('editLogo').value = logo || '';
    document.getElementById('editModal').style.display = 'flex';
  };

  window.closeEditModal = () => {
    document.getElementById('editModal').style.display = 'none';
  };

  window.saveCoachingEdit = async () => {
    if(!currentEditId) return;
    try {
      const data = {
        coachingName: document.getElementById('editName').value.trim(),
        director: document.getElementById('editDirector').value.trim(),
        phone: document.getElementById('editPhone').value.trim(),
        location: document.getElementById('editLocation').value.trim(),
        logoUrl: document.getElementById('editLogo').value.trim()
      };
      await updateDoc(doc(db, "schools", currentEditId), data);
      closeEditModal();
      loadConnectedCoachings();
      alert('✅ Updated successfully!');
    } catch(error) {
      alert('Error: ' + error.message);
    }
  };

  // ===== DELETE FUNCTIONS =====
  window.deleteCoaching = async (id, name) => {
    if(confirm(`Delete "${name}" permanently? This deletes ALL data!`)) {
      try {
        // Delete results
        const resultsSnap = await getDocs(collection(db, "schools", id, "results"));
        for(const r of resultsSnap.docs) {
          await deleteDoc(doc(db, "schools", id, "results", r.id));
        }
        // Delete drafts
        const draftsSnap = await getDocs(collection(db, "schools", id, "draft_results"));
        for(const d of draftsSnap.docs) {
          await deleteDoc(doc(db, "schools", id, "draft_results", d.id));
        }
        // Delete teachers
        const teachersSnap = await getDocs(collection(db, "schools", id, "teachers"));
        for(const t of teachersSnap.docs) {
          await deleteDoc(doc(db, "schools", id, "teachers", t.id));
        }
        // Delete school
        await deleteDoc(doc(db, "schools", id));
        alert(`"${name}" deleted!`);
        loadConnectedCoachings();
      } catch(error) {
        alert('Error: ' + error.message);
      }
    }
  };

  // ===== LOAD CONNECTED COACHINGS =====
  window.loadConnectedCoachings = async () => {
    try {
      const snap = await getDocs(collection(db, "schools"));
      const container = document.getElementById('coachingsList');
      document.getElementById('coachingCount').innerText = snap.size;

      if(snap.empty) {
        container.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i>No connected coachings found.<br><small>Go to "Add Customer" to add new coaching.</small></div>`;
        return;
      }

      let html = '';
      for(const d of snap.docs) {
        const c = d.data();
        const id = d.id;
        
        // Get results count
        let resultsCount = 0;
        try {
          const resultsSnap = await getDocs(collection(db, "schools", id, "results"));
          resultsCount = resultsSnap.size;
        } catch(e) { resultsCount = 0; }
        
        const logoHtml = c.logoUrl ? `<img src="${c.logoUrl}" onerror="this.style.display='none'">` : '';
        const demoBadge = c.demoResultsAdded ? `<span class="demo-badge">✅ Demo</span>` : '';
        
        html += `
          <div class="coaching-card">
            <div class="coaching-header">
              <div class="coaching-name">${logoHtml} 🎓 ${c.coachingName || c.name || 'Unnamed'} ${demoBadge}</div>
              <span class="status-badge"><i class="fas fa-check-circle"></i> Active</span>
            </div>
            <div class="coaching-details">
              <div><i class="fas fa-user-tie"></i> ${c.director || 'Director'}</div>
              <div><i class="fas fa-phone"></i> ${c.phone || 'N/A'}</div>
              <div><i class="fas fa-location-dot"></i> ${c.location || 'Location'}</div>
              <div><i class="fas fa-chart-line"></i> ${resultsCount} Results</div>
              ${c.directorEmail ? `<div><i class="fas fa-envelope"></i> ${c.directorEmail}</div>` : ''}
            </div>
            <div class="action-buttons">
              <a href="teacher-panel.html?coachingId=${id}" class="btn-dashboard" target="_blank">
                <i class="fas fa-tachometer-alt"></i> Open Panel
              </a>
              <button class="btn-whatsapp" onclick="shareOnWhatsApp('${c.phone}','${(c.coachingName||'').replace(/'/g,"\\'")}','${id}')">
                <i class="fab fa-whatsapp"></i> Share Link
              </button>
              <button class="btn-edit" onclick="openEditModal('${id}','${(c.coachingName||'').replace(/'/g,"\\'")}','${(c.director||'').replace(/'/g,"\\'")}','${c.phone||''}','${(c.location||'').replace(/'/g,"\\'")}','${(c.logoUrl||'').replace(/'/g,"\\'")}')">
                <i class="fas fa-pen"></i> Edit
              </button>
              <button class="btn-delete" onclick="deleteCoaching('${id}','${(c.coachingName||'').replace(/'/g,"\\'")}')">
                <i class="fas fa-trash-alt"></i> Delete
              </button>
            </div>
          </div>
        `;
      }
      container.innerHTML = html;
    } catch(error) {
      console.error('Error:', error);
      document.getElementById('coachingsList').innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i> Error loading data</div>';
    }
  };

  // ===== LOGIN CHECK =====
  onAuthStateChanged(auth, (user) => {
    if(user) {
      console.log('Logged in:', user.uid);
    } else {
      console.log('Not logged in');
    }
  });

  loadConnectedCoachings();
  setInterval(loadConnectedCoachings, 30000);
</script>
</body>
</html>
