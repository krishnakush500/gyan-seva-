<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>GYAN SEVA — Create Result</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
    body { background:#f0f2f5; min-height:100vh; padding:40px 24px; }
    .container { max-width:800px; margin:0 auto; }
    .card { background:white; border-radius:32px; padding:32px; box-shadow:0 20px 40px -12px rgba(0,0,0,0.1); }
    .card h2 { color:#1e293b; margin-bottom:8px; display:flex; align-items:center; gap:10px; }
    .card p { color:#64748b; margin-bottom:24px; }
    label { font-weight:600; display:block; margin:16px 0 6px; color:#1e293b; }
    input, textarea { width:100%; padding:12px; border:1px solid #ddd; border-radius:16px; font-size:0.9rem; }
    textarea { font-family:monospace; }
    .btn-publish { background:#10b981; color:white; padding:14px 28px; border:none; border-radius:40px; font-weight:600; cursor:pointer; margin-top:24px; width:100%; font-size:1rem; display:flex; align-items:center; justify-content:center; gap:8px; }
    .btn-publish:hover { background:#059669; }
    .status { margin-top:16px; padding:12px; border-radius:16px; text-align:center; }
    .status.success { background:#d1fae5; color:#065f46; }
    .status.error { background:#fee2e2; color:#b91c1c; }
    .back-link { display:inline-block; margin-top:20px; color:#2563eb; text-decoration:none; }
    .example { background:#f8fafc; padding:12px; border-radius:16px; font-size:0.75rem; font-family:monospace; margin-top:8px; }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h2><i class="fas fa-plus-circle" style="color:#10b981;"></i> Create New Result</h2>
    <p>Publish exam results — stored directly under coaching</p>
    <label>Exam Name</label>
    <input type="text" id="examName" placeholder="e.g., Annual Exam 2025">
    <label>Exam Date</label>
    <input type="date" id="examDate">
    <label>Subjects (comma separated)</label>
    <input type="text" id="subjects" placeholder="e.g., Mathematics, Science, English">
    <label>Student Marks Data (JSON)</label>
    <textarea id="marksData" rows="8" placeholder='[{"rollNo":"101","name":"Aryan","fatherName":"Rajesh","marks":{"Mathematics":85,"Science":90,"English":78}}]'></textarea>
    <div class="example">📋 Format: [{"rollNo":"101","name":"Name","fatherName":"Father","marks":{"Subject1":85,"Subject2":90}}]</div>
    <button class="btn-publish" onclick="publishResult()"><i class="fas fa-cloud-upload-alt"></i> Publish Result</button>
    <div id="status"></div>
    <a href="connected.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Connected Customers</a>
  </div>
</div>
<script type="module">
  import { db } from './firebase-config.js';
  import { collection, addDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  const urlParams = new URLSearchParams(window.location.search);
  const coachingId = urlParams.get('id');
  window.publishResult = async () => {
    const examName = document.getElementById('examName').value;
    const examDate = document.getElementById('examDate').value;
    const subjectsStr = document.getElementById('subjects').value;
    const marksJson = document.getElementById('marksData').value;
    if(!examName || !marksJson) { alert("Fill exam name and marks data"); return; }
    let students, subjects;
    try { students = JSON.parse(marksJson); subjects = subjectsStr.split(',').map(s=>s.trim()); } catch(e) { alert("Invalid JSON"); return; }
    const statusDiv = document.getElementById('status');
    statusDiv.innerHTML = '<div class="status"><i class="fas fa-spinner fa-pulse"></i> Publishing...</div>';
    try {
      const resultsRef = collection(db, "coachings", coachingId, "results");
      const newResult = await addDoc(resultsRef, { examName, examDate, subjects, publishedAt: new Date().toISOString(), totalStudents: students.length });
      for(let s of students) {
        const total = Object.values(s.marks).reduce((a,b)=>a+b,0);
        const percentage = (total / (subjects.length * 100)) * 100;
        await setDoc(doc(db, "coachings", coachingId, "results", newResult.id, "marks", s.rollNo), {
          name: s.name,
          fatherName: s.fatherName || '',
          marks: s.marks,
          total: total,
          percentage: percentage.toFixed(2)
        });
      }
      statusDiv.innerHTML = `<div class="status success">✅ Result published! <a href="dashboard.html?id=${coachingId}" target="_blank">View Dashboard</a></div>`;
      document.getElementById('examName').value = '';
      document.getElementById('marksData').value = '';
    } catch(error) {
      statusDiv.innerHTML = `<div class="status error">❌ Error: ${error.message}</div>`;
    }
  };
  if(!coachingId) document.body.innerHTML = '<h2 style="text-align:center; margin-top:50px;">Invalid coaching ID</h2>';
</script>
</body>
</html>
