<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>GYAN SEVA — Excel Entry</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #e8ecf1; min-height: 100vh; padding: 10px; }
        
        .topbar {
            background: linear-gradient(135deg, #1a237e, #283593);
            color: white;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .topbar .brand { font-size: 0.95rem; font-weight: 700; }
        .topbar .brand i { color: #ffc107; }
        .topbar .back-btn {
            background: rgba(255,255,255,0.15);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 4px 12px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.3s;
            text-decoration: none;
        }
        .topbar .back-btn:hover { background: rgba(255,255,255,0.25); color: white; }
        
        .container { max-width: 100%; margin: 0 auto; }
        
        .exam-summary {
            background: #f0f7ff;
            border-radius: 8px;
            padding: 8px 14px;
            margin-bottom: 10px;
            border: 1px solid #dce8f5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
            font-size: 0.7rem;
        }
        .exam-summary .info { display: flex; flex-wrap: wrap; gap: 4px 12px; }
        .exam-summary .info span { color: #1a237e; }
        .exam-summary .info strong { color: #0f172a; font-weight: 600; }
        .exam-summary .edit-btn {
            background: none;
            border: none;
            color: #1a237e;
            cursor: pointer;
            font-size: 0.8rem;
            padding: 2px 8px;
            border-radius: 6px;
            transition: 0.3s;
        }
        .exam-summary .edit-btn:hover { background: #dce8f5; }
        
        /* ===== EXCEL SHEET ===== */
        .excel-container {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #c8d0dc;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        
        .excel-table-wrapper {
            overflow-y: auto;
            max-height: 520px;
        }
        
        .excel-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            font-size: 0.85rem;
        }
        
        /* ===== ALL CELLS - SAME HEIGHT & PADDING ===== */
        .excel-table th,
        .excel-table td {
            padding: 6px 8px;
            border: 1px solid #c8d0dc;
            text-align: center;
            vertical-align: middle;
            height: 38px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* ===== HEADER - STICKY ===== */
        .excel-table thead {
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .excel-table th {
            background: #1a237e;
            color: white;
            font-weight: 600;
            font-size: 0.8rem;
        }
        
        .excel-table td {
            background: white;
        }
        .excel-table tr:hover td {
            background: #f0f5ff;
        }
        
        /* ===== COLUMN WIDTHS ===== */
        .col-serial { width: 45px; min-width: 40px; max-width: 50px; }
        .col-roll { width: 65px; min-width: 55px; max-width: 75px; }
        .col-name { width: 150px; min-width: 130px; }
        .col-father { width: 140px; min-width: 120px; }
        .col-subject { width: 100px; min-width: 85px; }
        .col-total { width: 65px; min-width: 55px; max-width: 75px; }
        .col-actions { width: 75px; min-width: 65px; max-width: 85px; }
        
        /* ===== DATA ROWS ===== */
        .excel-table .row-label {
            font-weight: 600;
            color: #1a237e;
            background: #f8faff;
            font-size: 0.8rem;
        }
        .excel-table .row-roll {
            font-weight: 600;
            color: #1a237e;
            font-size: 0.85rem;
        }
        
        /* ===== INPUT FIELDS ===== */
        .excel-table .row-name input,
        .excel-table .row-father input,
        .excel-table .row-marks input,
        .excel-table .add-row input {
            width: 100%;
            border: none;
            padding: 2px 4px;
            font-size: 0.85rem;
            background: transparent;
            text-align: center;
            outline: none;
            border-radius: 0;
            font-family: inherit;
            height: 30px;
        }
        .excel-table .row-name input,
        .excel-table .add-row .name-input-add {
            text-align: left;
        }
        .excel-table .row-father input,
        .excel-table .add-row .father-input-add {
            text-align: left;
        }
        .excel-table .row-name input:focus,
        .excel-table .row-father input:focus,
        .excel-table .row-marks input:focus,
        .excel-table .add-row input:focus {
            background: #e8f0fe;
            outline: 2px solid #1a237e;
            outline-offset: -1px;
        }
        .excel-table .row-marks input,
        .excel-table .add-row .marks-input-add {
            max-width: 60px;
            margin: 0 auto;
        }
        
        /* ===== ADD ROW BUTTON ===== */
        .btn-add-row {
            background: #e8f0fe;
            border: none;
            padding: 2px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #1a237e;
            cursor: pointer;
            transition: 0.2s;
            height: 28px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-add-row:hover {
            background: #d0ddf5;
        }
        
        /* ===== ACTIONS ===== */
        .excel-table .row-actions {
            white-space: nowrap;
        }
        .excel-table .row-actions button {
            background: none;
            border: none;
            padding: 2px 6px;
            cursor: pointer;
            font-size: 0.75rem;
            border-radius: 4px;
            transition: 0.2s;
        }
        .excel-table .row-actions .edit-btn:hover { background: #fef3c7; color: #d97706; }
        .excel-table .row-actions .del-btn:hover { background: #fee2e2; color: #dc2626; }
        
        /* ===== TOTAL ROW ===== */
        .excel-table .total-row td {
            background: #e8f0fe !important;
            font-weight: 700;
            color: #1a237e;
            border-top: 2px solid #1a237e;
            border-bottom: 2px solid #1a237e;
        }
        
        /* ===== ADD ROW (LAST ROW) ===== */
        .excel-table .add-row td {
            background: #f8faff;
            border-top: 1px dashed #1a237e;
        }
        .excel-table .add-row input {
            width: 100%;
            border: none;
            padding: 2px 4px;
            font-size: 0.85rem;
            background: transparent;
            text-align: center;
            outline: none;
            border-radius: 0;
            font-family: inherit;
            height: 30px;
        }
        
        /* ===== ACTION BAR ===== */
        .action-bar {
            padding: 10px 14px;
            background: #f8faff;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn-excel {
            font-size: 0.75rem;
            padding: 5px 14px;
            border-radius: 6px;
            font-weight: 600;
        }
        
        .edit-modal .modal-content { border-radius: 16px; }
        .edit-modal .modal-header { padding: 12px 16px; background: #1a237e; color: white; border-radius: 16px 16px 0 0; }
        .edit-modal .modal-header .btn-close { filter: brightness(0) invert(1); }
        .edit-modal .modal-body { padding: 16px; }
        .edit-modal .modal-footer { padding: 12px 16px; }
        
        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            body { padding: 5px; }
            .topbar { padding: 6px 10px; }
            .topbar .brand { font-size: 0.8rem; }
            .exam-summary { font-size: 0.6rem; padding: 6px 10px; }
            .excel-table th,
            .excel-table td {
                padding: 4px 5px;
                height: 32px;
                font-size: 0.7rem;
            }
            .col-name { width: 90px; min-width: 70px; }
            .col-father { width: 80px; min-width: 60px; }
            .col-subject { width: 70px; min-width: 60px; }
            .excel-table .row-marks input { max-width: 40px; font-size: 0.65rem; }
            .excel-table .row-name input { font-size: 0.65rem; }
            .excel-table .row-father input { font-size: 0.65rem; }
            .excel-table .add-row input { font-size: 0.65rem; }
            .btn-add-row { font-size: 0.6rem; padding: 1px 8px; height: 24px; }
            .btn-excel { font-size: 0.6rem; padding: 3px 8px; }
        }
        
        @media (min-width: 769px) {
            .container { max-width: 1200px; margin: 0 auto; }
            .excel-table th,
            .excel-table td {
                padding: 8px 12px;
                height: 42px;
                font-size: 0.9rem;
            }
            .col-name { width: 180px; min-width: 150px; }
            .col-father { width: 160px; min-width: 135px; }
            .col-subject { width: 115px; min-width: 100px; }
            .excel-table .row-marks input { max-width: 70px; }
            .btn-add-row { font-size: 0.8rem; padding: 2px 16px; height: 32px; }
            .btn-excel { font-size: 0.85rem; padding: 6px 18px; }
        }
    </style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
    <div class="brand"><i class="fas fa-table"></i> GYAN SEVA — Excel Entry</div>
    <div>
        <a href="manage-results.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
    </div>
</div>

<div class="container">
    <!-- Exam Summary -->
    <div class="exam-summary" id="examSummary">
        <div class="info">
            <span>📝 <strong id="summaryExamName">-</strong></span>
            <span>📚 <strong id="summaryClass">-</strong></span>
            <span>📅 <strong id="summaryDate">-</strong></span>
            <span>📆 <strong id="summarySession">-</strong></span>
            <span>📋 <strong id="summarySubjects">0</strong> subjects</span>
            <span>👨‍🎓 <strong id="summaryStudents">0</strong> students</span>
        </div>
        <button class="edit-btn" id="editExamDetailsBtn" title="Edit Exam Details">
            <i class="fas fa-pencil-alt"></i>
        </button>
    </div>

    <!-- Excel Sheet -->
    <div class="excel-container">
        <div class="excel-table-wrapper" id="tableWrapper">
            <table class="excel-table" id="excelTable">
                <thead id="tableHead">
                    <tr id="tableHeader">
                        <!-- 🔥 Fixed Columns -->
                        <th class="col-serial">#</th>
                        <th class="col-roll">Roll No</th>
                        <th class="col-name">Student Name</th>
                        <th class="col-father">Father Name</th>
                        <!-- 🔥 Subject Columns will be inserted here dynamically -->
                        <th class="col-total">Total</th>
                        <th class="col-actions">Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Students will be rendered here -->
                </tbody>
                <tfoot id="tableFoot">
                    <!-- 🔥 Total Row -->
                    <tr class="total-row" id="totalRow">
                        <td class="col-serial"></td>
                        <td class="col-roll"></td>
                        <td class="col-name" style="text-align:right; padding-right:10px;">Total: <span id="totalStudents">0</span></td>
                        <td class="col-father"></td>
                        <!-- Subject totals will be inserted here -->
                        <td class="col-total" id="grandTotal" style="text-align:center;">0</td>
                        <td class="col-actions"></td>
                    </tr>
                    <!-- 🔥 Add Row (Last Row) -->
                    <tr class="add-row" id="addRow">
                        <td class="col-serial" style="font-weight:600; color:#1a237e;">+</td>
                        <td class="col-roll"><input type="number" class="roll-input-add" id="newRoll" placeholder="Roll" value="1"></td>
                        <td class="col-name"><input type="text" class="name-input-add" id="newName" placeholder="Student Name"></td>
                        <td class="col-father"><input type="text" class="father-input-add" id="newFather" placeholder="Father"></td>
                        <!-- Subject inputs will be inserted here -->
                        <td class="col-total"></td>
                        <td class="col-actions">
                            <button class="btn-add-row" id="addRowBtn"><i class="fas fa-plus"></i> Add</button>
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>
        
        <!-- Action Buttons -->
        <div class="action-bar">
            <button class="btn btn-warning btn-excel" id="saveDraftBtn"><i class="fas fa-save"></i> Save as Draft</button>
            <button class="btn btn-success btn-excel" id="publishResultBtn"><i class="fas fa-globe"></i> Publish Result</button>
            <button class="btn btn-secondary btn-excel" id="clearAllBtn"><i class="fas fa-trash-alt"></i> Clear All</button>
        </div>
    </div>
</div>

<!-- ===== EDIT EXAM DETAILS MODAL ===== -->
<div class="modal fade edit-modal" id="editExamModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title"><i class="fas fa-edit"></i> Edit Exam Details</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-2">
                    <label class="form-label">Exam Name</label>
                    <input type="text" class="form-control" id="modalExamName" style="font-size:0.85rem;">
                </div>
                <div class="mb-2">
                    <label class="form-label">Class</label>
                    <input type="text" class="form-control" id="modalExamClass" style="font-size:0.85rem;">
                </div>
                <div class="mb-2">
                    <label class="form-label">Session</label>
                    <select class="form-select" id="modalExamSession" style="font-size:0.85rem;">
                        <option value="2026-2027">2026-2027</option>
                        <option value="2027-2028">2027-2028</option>
                        <option value="2028-2029">2028-2029</option>
                        <option value="2029-2030">2029-2030</option>
                    </select>
                </div>
                <div class="mb-2">
                    <label class="form-label">Exam Date</label>
                    <input type="date" class="form-control" id="modalExamDate" style="font-size:0.85rem;">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary btn-sm" id="saveExamDetailsBtn"><i class="fas fa-save"></i> Save</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { 
        getFirestore, 
        collection, 
        addDoc, 
        getDocs, 
        doc, 
        updateDoc, 
        deleteDoc, 
        query, 
        orderBy,
        serverTimestamp,
        where,
        getDoc
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCtrUQKvT-B66fXgxAF8yJA1e_9i98ddpA",
        authDomain: "gyan-seva.firebaseapp.com",
        projectId: "gyan-seva",
        storageBucket: "gyan-seva.firebasestorage.app",
        messagingSenderId: "451862212887",
        appId: "1:451862212887:web:637fd8785c4c01bd448752",
        measurementId: "G-R375P3YCHP"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let schoolId = localStorage.getItem('schoolId');
    let examData = JSON.parse(localStorage.getItem('examData') || '{}');
    
    let subjects = examData.subjects || [];
    let students = examData.students || [];
    let editingIndex = null;
    let isEditingDraft = examData.isEditingDraft || false;
    let draftId = examData.draftId || null;
    let isEditingPublished = examData.isEditingPublished || false;
    let publishedId = examData.publishedId || null;
    
    // ===== DOM =====
    const summaryExamName = document.getElementById('summaryExamName');
    const summaryClass = document.getElementById('summaryClass');
    const summaryDate = document.getElementById('summaryDate');
    const summarySession = document.getElementById('summarySession');
    const summarySubjects = document.getElementById('summarySubjects');
    const summaryStudents = document.getElementById('summaryStudents');
    
    const tableBody = document.getElementById('tableBody');
    const tableHeader = document.getElementById('tableHeader');
    const totalRow = document.getElementById('totalRow');
    const addRow = document.getElementById('addRow');
    const totalStudents = document.getElementById('totalStudents');
    const grandTotal = document.getElementById('grandTotal');
    
    const newRoll = document.getElementById('newRoll');
    const newName = document.getElementById('newName');
    const newFather = document.getElementById('newFather');
    const addRowBtn = document.getElementById('addRowBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const saveDraftBtn = document.getElementById('saveDraftBtn');
    const publishResultBtn = document.getElementById('publishResultBtn');
    
    const editExamModal = new bootstrap.Modal(document.getElementById('editExamModal'));
    const modalExamName = document.getElementById('modalExamName');
    const modalExamClass = document.getElementById('modalExamClass');
    const modalExamSession = document.getElementById('modalExamSession');
    const modalExamDate = document.getElementById('modalExamDate');
    const saveExamDetailsBtn = document.getElementById('saveExamDetailsBtn');
    const editExamDetailsBtn = document.getElementById('editExamDetailsBtn');
    
    // ===== BUILD HEADER DYNAMICALLY =====
    function buildHeader() {
        // Clear existing subject headers (keep fixed columns)
        const fixedHeaders = tableHeader.querySelectorAll('.col-serial, .col-roll, .col-name, .col-father, .col-total, .col-actions');
        
        // Remove old subject headers
        const oldSubjectHeaders = tableHeader.querySelectorAll('.col-subject');
        oldSubjectHeaders.forEach(el => el.remove());
        
        // Get reference to Total column (col-total)
        const totalTh = tableHeader.querySelector('.col-total');
        
        // Insert subject headers before Total
        subjects.forEach((s) => {
            const th = document.createElement('th');
            th.className = 'col-subject';
            th.textContent = `${s.name} (${s.total})`;
            tableHeader.insertBefore(th, totalTh);
        });
    }
    
    // ===== BUILD TOTAL ROW =====
    function buildTotalRow() {
        // Remove old subject total cells
        const oldSubjectTotals = totalRow.querySelectorAll('.col-subject-total');
        oldSubjectTotals.forEach(el => el.remove());
        
        // Get reference to grandTotal cell
        const grandTotalTd = totalRow.querySelector('.col-total');
        
        // Insert subject total cells before grandTotal
        subjects.forEach(() => {
            const td = document.createElement('td');
            td.className = 'col-subject-total';
            td.style.cssText = 'text-align:center; font-weight:700; color:#1a237e;';
            td.textContent = '0';
            totalRow.insertBefore(td, grandTotalTd);
        });
    }
    
    // ===== BUILD ADD ROW =====
    function buildAddRow() {
        // Remove old subject input cells
        const oldSubjectInputs = addRow.querySelectorAll('.col-subject-input');
        oldSubjectInputs.forEach(el => el.remove());
        
        // Get reference to total cell
        const totalTd = addRow.querySelector('.col-total');
        
        // Insert subject input cells before Total
        subjects.forEach((s) => {
            const td = document.createElement('td');
            td.className = 'col-subject-input';
            td.innerHTML = `<input type="number" class="marks-input-add" data-subject="${s.name}" min="0" max="${s.total}" placeholder="0" style="max-width:60px; width:100%;">`;
            addRow.insertBefore(td, totalTd);
        });
    }
    
    // ===== RENDER STUDENTS =====
    function renderTable() {
        if (students.length === 0) {
            tableBody.innerHTML = '';
            updateTotals();
            return;
        }
        
        let html = '';
        let allTotals = [];
        subjects.forEach(() => allTotals.push(0));
        let grandTotalSum = 0;
        
        students.forEach((s, idx) => {
            let marksHtml = '';
            let total = 0;
            subjects.forEach((sub, subIdx) => {
                const mark = s.marks[sub.name] || 0;
                total += mark;
                allTotals[subIdx] += mark;
                marksHtml += `<td class="row-marks"><input type="number" class="mark-input" data-idx="${idx}" data-subject="${sub.name}" value="${mark}" min="0" max="${sub.total}" style="max-width:60px; width:100%;"></td>`;
            });
            grandTotalSum += total;
            html += `
                <tr>
                    <td class="row-label">${idx + 1}</td>
                    <td class="row-roll">${s.rollNo}</td>
                    <td class="row-name"><input type="text" class="name-input" data-idx="${idx}" value="${s.name}" style="width:100%;"></td>
                    <td class="row-father"><input type="text" class="father-input" data-idx="${idx}" value="${s.fatherName || ''}" style="width:100%;"></td>
                    ${marksHtml}
                    <td style="text-align:center; font-weight:600; color:#1a237e;">${total}</td>
                    <td class="row-actions">
                        <button class="edit-btn" onclick="editStudent(${idx})"><i class="fas fa-edit"></i></button>
                        <button class="del-btn" onclick="deleteStudent(${idx})"><i class="fas fa-trash-alt"></i></button>
                    </td>
                </tr>
            `;
        });
        
        tableBody.innerHTML = html;
        totalStudents.textContent = students.length;
        
        // Update totals
        updateTotals(allTotals, grandTotalSum);
        
        // Auto-save on input change
        document.querySelectorAll('.name-input, .father-input, .mark-input').forEach(input => {
            input.addEventListener('change', () => {
                const idx = parseInt(input.dataset.idx);
                if (!isNaN(idx) && students[idx]) {
                    if (input.classList.contains('name-input')) {
                        students[idx].name = input.value;
                    } else if (input.classList.contains('father-input')) {
                        students[idx].fatherName = input.value;
                    } else if (input.classList.contains('mark-input')) {
                        const sub = input.dataset.subject;
                        students[idx].marks[sub] = parseInt(input.value) || 0;
                    }
                    renderTable();
                    updateSummary();
                }
            });
        });
    }
    
    function updateTotals(allTotals = null, grandTotalSum = null) {
        if (allTotals) {
            const subjectTotalCells = totalRow.querySelectorAll('.col-subject-total');
            subjectTotalCells.forEach((cell, idx) => {
                cell.textContent = allTotals[idx] || 0;
            });
            grandTotal.textContent = grandTotalSum || 0;
        } else {
            // Reset totals
            const subjectTotalCells = totalRow.querySelectorAll('.col-subject-total');
            subjectTotalCells.forEach(cell => cell.textContent = '0');
            grandTotal.textContent = '0';
        }
    }
    
    function updateSummary() {
        summaryExamName.textContent = examData.examName || '-';
        summaryClass.textContent = examData.examClass || '-';
        summaryDate.textContent = examData.examDate ? new Date(examData.examDate).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '-';
        summarySession.textContent = examData.examSession || '-';
        summarySubjects.textContent = subjects.length || 0;
        summaryStudents.textContent = students.length || 0;
    }
    
    function updateRollNumber() {
        const maxRoll = students.reduce((max, s) => Math.max(max, s.rollNo || 0), 0);
        newRoll.value = maxRoll + 1;
    }
    
    // ===== INIT =====
    function init() {
        buildHeader();
        buildTotalRow();
        buildAddRow();
        updateSummary();
        renderTable();
        updateRollNumber();
    }
    
    // ===== ADD STUDENT =====
    addRowBtn.addEventListener('click', () => {
        if (editingIndex !== null) {
            // Update existing student
            const roll = parseInt(newRoll.value) || 1;
            const name = newName.value.trim();
            const father = newFather.value.trim();
            if (!name) { alert('Enter name'); return; }
            
            const marks = {};
            document.querySelectorAll('.marks-input-add').forEach(input => {
                const sub = input.dataset.subject;
                marks[sub] = parseInt(input.value) || 0;
            });
            
            students[editingIndex] = { rollNo: roll, name, fatherName: father, marks };
            renderTable();
            updateSummary();
            cancelEdit();
            return;
        }
        
        // Add new student
        const roll = parseInt(newRoll.value) || 1;
        const name = newName.value.trim();
        const father = newFather.value.trim();
        
        if (!name) { alert('Please enter student name'); return; }
        
        const marks = {};
        document.querySelectorAll('.marks-input-add').forEach(input => {
            const sub = input.dataset.subject;
            marks[sub] = parseInt(input.value) || 0;
        });
        
        students.push({ rollNo: roll, name, fatherName: father, marks });
        renderTable();
        updateSummary();
        updateRollNumber();
        newName.value = '';
        newFather.value = '';
        document.querySelectorAll('.marks-input-add').forEach(input => input.value = '');
    });
    
    // ===== EDIT STUDENT =====
    window.editStudent = function(idx) {
        const s = students[idx];
        editingIndex = idx;
        newRoll.value = s.rollNo;
        newName.value = s.name;
        newFather.value = s.fatherName || '';
        document.querySelectorAll('.marks-input-add').forEach(input => {
            const sub = input.dataset.subject;
            input.value = s.marks[sub] || 0;
        });
        addRowBtn.innerHTML = '<i class="fas fa-save"></i> Update';
        addRowBtn.classList.add('btn-warning');
        addRowBtn.classList.remove('btn-primary');
        // Focus on name input
        newName.focus();
    };
    
    function cancelEdit() {
        editingIndex = null;
        newName.value = '';
        newFather.value = '';
        document.querySelectorAll('.marks-input-add').forEach(input => input.value = '');
        addRowBtn.innerHTML = '<i class="fas fa-plus"></i> Add';
        addRowBtn.classList.remove('btn-warning');
        addRowBtn.classList.add('btn-primary');
        updateRollNumber();
    }
    
    window.deleteStudent = function(idx) {
        if (confirm('Delete this student?')) {
            students.splice(idx, 1);
            renderTable();
            updateSummary();
            updateRollNumber();
        }
    };
    
    // ===== CLEAR ALL =====
    clearAllBtn.addEventListener('click', () => {
        if (confirm('Delete all students?')) {
            students = [];
            renderTable();
            updateSummary();
            updateRollNumber();
        }
    });
    
    // ===== EDIT EXAM DETAILS =====
    editExamDetailsBtn.addEventListener('click', () => {
        modalExamName.value = examData.examName || '';
        modalExamClass.value = examData.examClass || '';
        modalExamSession.value = examData.examSession || '2026-2027';
        modalExamDate.value = examData.examDate || '';
        editExamModal.show();
    });
    
    saveExamDetailsBtn.addEventListener('click', () => {
        examData.examName = modalExamName.value.trim();
        examData.examClass = modalExamClass.value.trim();
        examData.examSession = modalExamSession.value;
        examData.examDate = modalExamDate.value;
        updateSummary();
        editExamModal.hide();
        alert('Exam details updated!');
    });
    
    // ===== SAVE DRAFT =====
    saveDraftBtn.addEventListener('click', async () => {
        if (!examData.examName) { alert('Please enter exam name'); return; }
        if (students.length === 0) { alert('Please add at least one student'); return; }
        if (!schoolId) { alert('Institute not found'); return; }
        
        try {
            const data = {
                examName: examData.examName,
                class: examData.examClass,
                session: examData.examSession,
                examDate: examData.examDate,
                subjects: subjects,
                students: students,
                createdAt: serverTimestamp()
            };
            
            if (isEditingDraft && draftId) {
                await updateDoc(doc(db, "schools", schoolId, "draft_results", draftId), data);
                alert('Draft updated!');
            } else {
                await addDoc(collection(db, "schools", schoolId, "draft_results"), data);
                alert('Draft saved!');
            }
            
            setTimeout(() => {
                window.close();
                window.location.href = 'manage-results.html';
            }, 1500);
        } catch(error) {
            alert('Error: ' + error.message);
        }
    });
    
    // ===== PUBLISH RESULT =====
    publishResultBtn.addEventListener('click', async () => {
        if (!examData.examName) { alert('Please enter exam name'); return; }
        if (students.length === 0) { alert('Please add at least one student'); return; }
        if (!schoolId) { alert('Institute not found'); return; }
        
        if (isEditingPublished) {
            if (!confirm('Update the existing published result?')) return;
        }
        
        try {
            const data = {
                examName: examData.examName,
                class: examData.examClass,
                session: examData.examSession,
                examDate: examData.examDate,
                subjects: subjects,
                students: students,
                isDemo: false
            };
            
            if (isEditingPublished && publishedId) {
                data.updatedAt = serverTimestamp();
                await updateDoc(doc(db, "schools", schoolId, "results", publishedId), data);
                alert('Result updated!');
            } else {
                data.createdAt = serverTimestamp();
                await addDoc(collection(db, "schools", schoolId, "results"), data);
                if (isEditingDraft && draftId) {
                    await deleteDoc(doc(db, "schools", schoolId, "draft_results", draftId));
                }
                alert('Result published!');
            }
            
            setTimeout(() => {
                window.close();
                window.location.href = 'manage-results.html';
            }, 1500);
        } catch(error) {
            alert('Error: ' + error.message);
        }
    });
    
    // ===== INIT =====
    init();
    console.log('✅ Step 2 Excel Loaded:', examData);
</script>
</body>
</html>
