<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>GYAN SEVA - Result</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #ffffff; min-height:100vh; padding:30px 20px; }
    .result-container { max-width:750px; margin:0 auto; }
    .action-buttons { display:flex; justify-content:center; gap:15px; margin-bottom:25px; flex-wrap:wrap; }
    .action-btn { padding:12px 28px; border:none; border-radius:50px; font-size:0.9rem; font-weight:600; cursor:pointer; transition:all 0.3s; display:inline-flex; align-items:center; gap:10px; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
    .action-btn:hover { transform:translateY(-2px); box-shadow:0 4px 15px rgba(0,0,0,0.15); }
    .btn-download { background:#28a745; color:white; }
    .btn-share { background:#25D366; color:white; }
    .btn-print { background:#1a237e; color:white; }
    .result-card { width:100%; background:white; border-radius:12px; box-shadow:0 8px 25px rgba(0,0,0,0.15); padding:15px; position:relative; overflow-x:auto; }
    .result-card-header { text-align:center; margin-bottom:15px; padding-bottom:8px; border-bottom:2px solid #1a237e; display:flex; align-items:center; justify-content:center; gap:15px; flex-wrap:wrap; background:white; }
    .result-logo { width:80px; height:80px; border-radius:50%; border:3px solid #1a237e; overflow:hidden; background:white; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
    .result-logo img { width:100%; height:100%; object-fit:cover; }
    .result-title { text-align:center; }
    .result-title h2 { color:#1a237e; margin-bottom:4px; font-size:1.2rem; }
    .result-title h3 { color:#b21f1f; margin-bottom:4px; font-size:1rem; }
    .result-title p { color:#666; font-size:0.8rem; }
    .student-info { margin-bottom:15px; }
    .info-row { display:flex; flex-direction:column; margin-bottom:6px; padding:6px 10px; background:#f5f5f5; border-radius:5px; }
    .info-label { font-weight:600; color:#1a237e; font-size:0.85rem; margin-bottom:2px; }
    .info-value { color:#333; font-size:0.9rem; }
    .marks-table { width:100%; border-collapse:collapse; margin-bottom:15px; min-width:400px; }
    .marks-table th { background:#1a237e; color:white; padding:10px 8px; text-align:left; font-size:0.85rem; }
    .marks-table td { padding:8px; border-bottom:1px solid #ddd; font-size:0.85rem; }
    .marks-table tr:nth-child(even) { background:#f9f9f9; }
    .total-marks { background:#e8f5e8 !important; font-weight:600; color:#1a237e; }
    .grade-a-plus { background:#d4edda; color:#155724; font-weight:600; text-align:center; border-radius:20px; display:inline-block; padding:2px 10px; }
    .grade-a { background:#d1ecf1; color:#0c5460; font-weight:600; text-align:center; border-radius:20px; display:inline-block; padding:2px 10px; }
    .grade-b-plus { background:#fff3cd; color:#856404; font-weight:600; text-align:center; border-radius:20px; display:inline-block; padding:2px 10px; }
    .grade-b { background:#ffe6b3; color:#856404; font-weight:600; text-align:center; border-radius:20px; display:inline-block; padding:2px 10px; }
    .grade-c { background:#ffe0b3; color:#cc7000; font-weight:600; text-align:center; border-radius:20px; display:inline-block; padding:2px 10px; }
    .grade-d { background:#f8d7da; color:#721c24; font-weight:600; text-align:center; border-radius:20px; display:inline-block; padding:2px 10px; }
    .grade-f { background:#f5c6cb; color:#721c24; font-weight:600; text-align:center; border-radius:20px; display:inline-block; padding:2px 10px; }
    .percentage-display { text-align:center; font-size:1.1rem; color:#1a237e; font-weight:700; padding:10px; background:#f0f7ff; border-radius:8px; margin-top:12px; }
    .division-display { text-align:center; font-size:1.2rem; font-weight:700; padding:10px; margin-top:10px; border-radius:8px; }
    .coaching-mention { text-align:center; margin-top:20px; padding-top:12px; border-top:2px solid #ddd; color:#666; font-style:italic; font-size:0.85rem; }
    @media (max-width:600px){ .result-logo { width:55px; height:55px; } .result-title h2 { font-size:1rem; } .marks-table { min-width:320px; } .action-btn { padding:8px 16px; font-size:0.75rem; } }
    @media print { body { background:white; padding:0; } .action-buttons { display:none; } .result-card { box-shadow:none; border-radius:0; padding:0; } }
  </style>
</head>
<body>
<div class="result-container">
  <div class="action-buttons">
    <button class="action-btn btn-download" onclick="downloadResultPDF()"><i class="fas fa-download"></i> Download PDF</button>
    <button class="action-btn btn-share" onclick="shareOnWhatsApp()"><i class="fab fa-whatsapp"></i> Share on WhatsApp</button>
    <button class="action-btn btn-print" onclick="window.print()"><i class="fas fa-print"></i> Print</button>
  </div>
  
  <div class="result-card" id="resultCard">
    <div class="result-card-header">
      <div class="result-logo"><img id="coachingLogo" src="https://via.placeholder.com/80?text=Logo" alt="Logo" onerror="this.src='https://via.placeholder.com/80?text=Logo'"></div>
      <div class="result-title">
        <h2 id="coachingName">GYAN SEVA</h2>
        <h3 id="examName">Exam Name</h3>
        <p>Under the guidance of <strong id="directorName">Director</strong></p>
      </div>
    </div>
    
    <div class="student-info">
      <div class="info-row"><span class="info-label">Student Name:</span><span class="info-value" id="studentName">-</span></div>
      <div class="info-row"><span class="info-label">Father's Name:</span><span class="info-value" id="fatherName">-</span></div>
      <div class="info-row"><span class="info-label">Roll Number:</span><span class="info-value" id="studentRoll">-</span></div>
    </div>
    
    <table class="marks-table"><thead><tr><th>Subject</th><th>Marks Obtained</th><th>Total Marks</th><th>Grade</th></tr></thead><tbody id="marksTableBody"></tbody></table>
    <div class="percentage-display" id="totalPercentage">Total Percentage: 0%</div>
    <div class="division-display" id="divisionBox">Division: -</div>
    <div class="coaching-mention" id="coachingMention"></div>
  </div>
</div>

<script>
  function getGrade(percentage) {
    if(percentage >= 90) return { grade: "A+", className: "grade-a-plus" };
    if(percentage >= 75) return { grade: "A", className: "grade-a" };
    if(percentage >= 65) return { grade: "B+", className: "grade-b-plus" };
    if(percentage >= 55) return { grade: "B", className: "grade-b" };
    if(percentage >= 45) return { grade: "C", className: "grade-c" };
    if(percentage >= 33) return { grade: "D", className: "grade-d" };
    return { grade: "F", className: "grade-f" };
  }
  
  const urlParams = new URLSearchParams(window.location.search);
  const studentName = decodeURIComponent(urlParams.get('name') || '-');
  const studentRoll = decodeURIComponent(urlParams.get('roll') || '-');
  const fatherName = decodeURIComponent(urlParams.get('father') || '-');
  const examName = decodeURIComponent(urlParams.get('exam') || 'Examination');
  const examDate = decodeURIComponent(urlParams.get('date') || '');
  const subjects = JSON.parse(decodeURIComponent(urlParams.get('subjects') || '[]'));
  const marks = JSON.parse(decodeURIComponent(urlParams.get('marks') || '{}'));
  const totalPercent = decodeURIComponent(urlParams.get('percent') || '0');
  const division = decodeURIComponent(urlParams.get('division') || '-');
  
  const coachingName = localStorage.getItem('coachingName') || 'GYAN SEVA';
  const directorName = localStorage.getItem('directorName') || 'Director';
  const coachingLogo = localStorage.getItem('coachingLogo') || 'https://via.placeholder.com/80?text=Logo';
  const coachingPhone = localStorage.getItem('directorPhone') || 'Not provided';
  
  document.getElementById('coachingLogo').src = coachingLogo;
  document.getElementById('coachingName').innerText = coachingName;
  document.getElementById('directorName').innerText = directorName;
  document.getElementById('examName').innerText = examDate ? `${examName} | ${examDate}` : examName;
  document.getElementById('studentName').innerText = studentName;
  document.getElementById('studentRoll').innerText = studentRoll;
  document.getElementById('fatherName').innerText = fatherName;
  document.getElementById('totalPercentage').innerHTML = `Total Percentage: ${totalPercent}%`;
  document.getElementById('coachingMention').innerHTML = `<p>This result is published by ${coachingName} | Director: ${directorName}</p><p>For queries: ${coachingPhone}</p>`;
  
  const divisionBox = document.getElementById('divisionBox');
  if(division === 'FIRST DIVISION') { divisionBox.style.background = '#d4edda'; divisionBox.style.color = '#28a745'; divisionBox.style.border = '2px solid #28a745'; }
  else if(division === 'SECOND DIVISION') { divisionBox.style.background = '#d1ecf1'; divisionBox.style.color = '#17a2b8'; divisionBox.style.border = '2px solid #17a2b8'; }
  else if(division === 'THIRD DIVISION') { divisionBox.style.background = '#fff3cd'; divisionBox.style.color = '#ffc107'; divisionBox.style.border = '2px solid #ffc107'; }
  else { divisionBox.style.background = '#f8d7da'; divisionBox.style.color = '#dc3545'; divisionBox.style.border = '2px solid #dc3545'; }
  divisionBox.innerHTML = `Division: ${division}`;
  
  let marksHtml = '', totalObtained = 0, totalMax = 0;
  for(let i = 0; i < subjects.length; i++) {
    const subj = subjects[i];
    const mark = marks[subj] || 0;
    const max = 100;
    const subPercent = (mark / max) * 100;
    const gradeInfo = getGrade(subPercent);
    totalObtained += mark; totalMax += max;
    marksHtml += `<tr><td>${subj}</td><td>${mark}</td><td>${max}</td><td><span class="${gradeInfo.className}">${gradeInfo.grade}</span></td></tr>`;
  }
  marksHtml += `<tr class="total-marks"><td><strong>Total</strong></td><td><strong>${totalObtained}</strong></td><td><strong>${totalMax}</strong></td><td></td></tr>`;
  document.getElementById('marksTableBody').innerHTML = marksHtml;
  
  function downloadResultPDF() {
    const btn = document.querySelector('.btn-download');
    const originalText = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating...';
    btn.disabled = true;
    html2pdf().set({ margin: [10,10,10,10], filename: `${studentRoll}_Result.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } }).from(document.getElementById('resultCard')).save().then(() => { btn.innerHTML = originalText; btn.disabled = false; }).catch(() => { btn.innerHTML = originalText; btn.disabled = false; alert('Error generating PDF'); });
  }
  
  function shareOnWhatsApp() {
    const shareText = `📢 *Result Published* 📢\n\n🏫 *${coachingName}*\n📚 *${examName}*\n\n👨‍🎓 Student: ${studentName}\n📝 Roll No: ${studentRoll}\n📊 Percentage: ${totalPercent}%\n📞 Contact: ${coachingPhone}`;
    window.open(`https://wa.me/?text=${encodeURIComponent(shareText)}`, '_blank');
  }
  
  document.title = `${studentName} - ${examName} Result | GYAN SEVA`;
</script>
</body>
</html>
